# Builds the flickr image on the household's own runners, pushes it to the
# cluster registry, and deploys it by writing one Nomad variable.
#
# THE SHAPE IS workqueue10's (ckopsa/waymark image.yml): CI never touches
# an allocation. It writes `nomad/jobs/flickr/deploy image_tag=<tag>`;
# the job's template (terraform/nomad-jobs/flickr.hcl in
# ckopsa/home-infrastructure) reads it, restarts the task on the change,
# and force_pull makes the restart fetch the tag. The CI token can write
# that one variable path and read the job — nothing else.
#
# NO DOCKER DAEMON. The `flickr` runner group deliberately mounts no
# docker socket (a job here is not root on the host), so the image is
# assembled by crane: the arm64 binary and web/ as ONE layer appended to
# the jellyfin base — the same COPY-only image dockerfiles/flickr/
# Dockerfile describes, minus the daemon. The base is jellyfin's because
# its arm64 jellyfin-ffmpeg carries Rockchip MPP (h264_rkmpp), which the
# server test-encodes at startup before trusting.
#
# WHY docker.kopsa.info AND NOT GHCR: the runner is on the LAN, so the
# cluster registry is one hop away and the node pulls from it already;
# the repository is private, so a GHCR package would need pull
# credentials on the node. The registry takes no credentials and is
# LAN-only (home-infrastructure#9) — a runner off the LAN cannot push,
# and the first step says so instead of failing three steps later.
#
# THE TAG IS THE SHORT SHA, and `:latest` follows it, so a laptop's
# build.sh (TAG=<sha>) and this workflow name the same image.

name: image

on:
  push:
    branches: [master]
    # Only what the image carries: the server and the web UI. A docs,
    # beads or workflow-only commit does not rebuild and redeploy.
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/image.yml'
  workflow_dispatch:

# A second push to master makes the first build's image unwanted before
# it finishes; the newer commit is the one to deploy.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.kopsa.info
  IMAGE: docker.kopsa.info/flickr
  BASE: jellyfin/jellyfin:latest
  CRANE_VERSION: v0.20.3

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      tag: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: The registry is on the LAN
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://${REGISTRY}/v2/" || true)
          if [ "$code" != "200" ]; then
            echo "::error::https://${REGISTRY}/v2/ answered ${code}: this runner is not on the LAN (CI_RUNNER unset, or the registry allowlist changed). Nothing pushed."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules, build cache and crane
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin/crane
          key: image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ env.CRANE_VERSION }}
          restore-keys: |
            image-${{ runner.os }}-${{ runner.arch }}-

      - name: Tag
        id: tag
        # `git rev-parse --short HEAD`, the way build.sh's TAG=$(…) is
        # documented, so a laptop build and this one name the same image.
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile for the orangepi (linux/arm64, pure Go)
        run: |
          set -euo pipefail
          mkdir -p out/app
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags='-s -w' -o out/app/server ./cmd/server
          cp -r web out/app/web
          # one layer: /app/server and /app/web/…, owned by root, fixed mtimes
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='2000-01-01' \
              -C out -cf layer.tar app
          ls -l layer.tar

      - name: crane
        run: |
          set -euo pipefail
          if [ ! -x ~/go/bin/crane ] || [ "$(~/go/bin/crane version)" != "${CRANE_VERSION#v}" ]; then
            go install "github.com/google/go-containerregistry/cmd/crane@${CRANE_VERSION}"
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Assemble and push ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          # the layer on the arm64 base, then the config the Dockerfile set:
          # PATH with jellyfin-ffmpeg first, workdir, entrypoint
          crane --platform linux/arm64 append -b "$BASE" -f layer.tar -t "${IMAGE}:${TAG}"
          crane --platform linux/arm64 mutate "${IMAGE}:${TAG}" -t "${IMAGE}:${TAG}" \
            --entrypoint /app/server --workdir /app \
            -e PATH=/usr/lib/jellyfin-ffmpeg:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          # prove the config before anything points at it
          crane --platform linux/arm64 config "${IMAGE}:${TAG}" > config.json
          python3 - <<'PY'
          import json
          c = json.load(open("config.json"))
          cfg = c["config"]
          assert c["architecture"] == "arm64", c["architecture"]
          assert cfg.get("Entrypoint") == ["/app/server"], cfg.get("Entrypoint")
          assert cfg.get("WorkingDir") == "/app", cfg.get("WorkingDir")
          assert any(e.startswith("PATH=/usr/lib/jellyfin-ffmpeg:") for e in cfg.get("Env", [])), cfg.get("Env")
          print("cmd inherited from the base (the server reads no arguments):", cfg.get("Cmd"))
          PY
          crane tag "${IMAGE}:${TAG}" latest
          echo "pushed ${IMAGE}:${TAG} and :latest"

  # Writing the var is the whole deploy. Skipped, with a notice, until the
  # NOMAD_ADDR / NOMAD_TOKEN secrets exist — the image is pushed either
  # way, and RUNBOOK.md's by-hand write deploys it.
  deploy:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Secrets present?
        id: gate
        run: |
          if [ -z "${NOMAD_ADDR}" ] || [ -z "${NOMAD_TOKEN}" ]; then
            echo "::notice::NOMAD_ADDR / NOMAD_TOKEN are not set on this repository; image pushed, deploy left to the RUNBOOK's by-hand write."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-nomad@v1.0.0
        if: steps.gate.outputs.go == 'true'

      - name: Point the job at the new image
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          nomad var put -force nomad/jobs/flickr/deploy image_tag="$TAG" >/dev/null
          echo "deploying ${IMAGE}:${TAG}"

      - name: Watch the restart land
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          # the task restarts on the template change; wait for a running
          # alloc whose server task started after the write (up to 4 min)
          cat > started.py <<'PY'
          import sys, json, datetime
          best = 0
          for a in json.load(sys.stdin):
              if a.get("ClientStatus") != "running":
                  continue
              ts = a.get("TaskStates", {}).get("server", {})
              t = ts.get("StartedAt", "")
              if not t or ts.get("State") != "running":
                  continue
              t = t.split(".")[0].rstrip("Z")
              best = max(best, int(datetime.datetime.fromisoformat(t).replace(tzinfo=datetime.timezone.utc).timestamp()))
          print(best)
          PY
          since=$(date -u +%s)
          for i in $(seq 1 48); do
            started=$(nomad job allocs -json flickr 2>/dev/null | python3 started.py || echo 0)
            if [ "$started" -ge "$((since - 5))" ]; then
              echo "server task restarted at $(date -u -d @"$started" +%FT%TZ) on ${IMAGE}:${TAG}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::no running server task started after the deploy write within 4 minutes — the tag is written; check \`nomad job status flickr\` (a bad image restarts in a loop; roll back with an older tag from the registry)."
          exit 1

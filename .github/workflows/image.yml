# Builds the flickr image on the household's own runners, pushes it to the
# cluster registry, and deploys it by writing one Nomad variable.
#
# THE SHAPE IS workqueue10's (ckopsa/waymark image.yml): CI never touches
# an allocation. It writes `nomad/jobs/flickr/deploy image_tag=<tag>`;
# the job's template (terraform/nomad-jobs/flickr.hcl in
# ckopsa/home-infrastructure) reads it, restarts the task on the change,
# and force_pull makes the restart fetch the tag. The CI token can write
# that one variable path and read the job — nothing else.
#
# NO DOCKER DAEMON. The `flickr` runner group deliberately mounts no
# docker socket (a job here is not root on the host), so the image is
# assembled by crane: the arm64 binary and web/ as ONE layer appended to
# the jellyfin base — the same COPY-only image dockerfiles/flickr/
# Dockerfile describes, minus the daemon. The base is jellyfin's because
# its arm64 jellyfin-ffmpeg carries Rockchip MPP (h264_rkmpp), which the
# server test-encodes at startup before trusting.
#
# WHY docker.kopsa.info AND NOT GHCR: the runner is on the LAN, so the
# cluster registry is one hop away and the node pulls from it already;
# the repository is private, so a GHCR package would need pull
# credentials on the node. The registry takes no credentials and is
# LAN-only (home-infrastructure#9) — a runner off the LAN cannot push,
# and the first step says so instead of failing three steps later.
#
# THE TAG IS THE SHORT SHA, and `:latest` follows it, so a laptop's
# build.sh (TAG=<sha>) and this workflow name the same image.
#
# A SECOND IMAGE, docker.kopsa.info/flickr-transcriber, carries the
# whisper worker: cmd/transcriber cross-compiled for amd64 and appended
# the same COPY-only way to ghcr.io/ggml-org/whisper.cpp:main-vulkan.
# The Vulkan build is the cross-vendor one — big-colt is an amd64 SteamOS
# box with an AMD GPU, and Vulkan reaches it without ROCm or a vendor
# runtime. Its runtime stage is ubuntu 24.04 and already carries ffmpeg
# and whisper-cli (under /app/build/bin, which its PATH names), so the
# layer is one binary and the config keeps that PATH.
#
# THE LAN SIDE (terraform/nomad-jobs/flickr.hcl in
# ckopsa/home-infrastructure): the transcriber group is pinned to
# big-colt, reads `transcriber_tag` from the same
# nomad/jobs/flickr/deploy variable, passes /dev/dri through to the
# container and mounts the whisper model from a host path. The worker
# reads env and nothing else — FLICKR_URL, OIDC_ISSUER,
# TRANSCRIBER_CLIENT_ID and TRANSCRIBER_CLIENT_SECRET (its own Keycloak
# service-account client), WHISPER_MODEL (the mounted model's path) and
# the MINIO_* the server uses.
#
# ONE VARIABLE, TWO KEYS. `nomad var put` REPLACES the variable, so every
# write carries both. The server's deploy goes first and writes back
# whatever transcriber_tag is already there, so a ghcr outage cannot hold
# the server back; the transcriber job writes both again with its own sha
# once its image is pushed, and its failure is its own.

name: image

on:
  push:
    branches: [master]
    # Only what the image carries: the server and the web UI. A docs,
    # beads or workflow-only commit does not rebuild and redeploy.
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/image.yml'
  workflow_dispatch:

# A second push to master makes the first build's image unwanted before
# it finishes; the newer commit is the one to deploy.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.kopsa.info
  IMAGE: docker.kopsa.info/flickr
  BASE: jellyfin/jellyfin:latest
  TRANSCRIBER_IMAGE: docker.kopsa.info/flickr-transcriber
  TRANSCRIBER_BASE: ghcr.io/ggml-org/whisper.cpp:main-vulkan
  CRANE_VERSION: v0.20.3

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      tag: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: The registry is on the LAN
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://${REGISTRY}/v2/" || true)
          if [ "$code" != "200" ]; then
            echo "::error::https://${REGISTRY}/v2/ answered ${code}: this runner is not on the LAN (CI_RUNNER unset, or the registry allowlist changed). Nothing pushed."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules, build cache and crane
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin/crane
          key: image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ env.CRANE_VERSION }}
          restore-keys: |
            image-${{ runner.os }}-${{ runner.arch }}-

      - name: Tag
        id: tag
        # `git rev-parse --short HEAD`, the way build.sh's TAG=$(…) is
        # documented, so a laptop build and this one name the same image.
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile for the orangepi (linux/arm64, pure Go)
        run: |
          set -euo pipefail
          mkdir -p out/app
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags='-s -w' -o out/app/server ./cmd/server
          cp -r web out/app/web
          # one layer: /app/server and /app/web/…, owned by root. The mtime
          # is the COMMIT's time: reproducible per commit, and an honest
          # Last-Modified — a year-2000 stamp let browsers call the shell
          # fresh for years (2026-09-07).
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
              -C out -cf layer.tar app
          ls -l layer.tar

      - name: crane
        run: |
          set -euo pipefail
          if [ ! -x ~/go/bin/crane ] || [ "$(~/go/bin/crane version)" != "${CRANE_VERSION#v}" ]; then
            go install "github.com/google/go-containerregistry/cmd/crane@${CRANE_VERSION}"
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Assemble and push ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          # The LAN registry has dropped a large upload mid-way twice today
          # (`tls: bad record MAC`, 2026-09-08). A push is idempotent per
          # blob — crane skips what the registry already holds — so a
          # second try costs only the blob that broke.
          push() { local n; for n in 1 2 3; do "$@" && return 0; echo "push attempt $n failed; retrying in 20s"; sleep 20; done; "$@"; }
          # the layer on the arm64 base, then the config the Dockerfile set:
          # PATH with jellyfin-ffmpeg first, workdir, entrypoint
          push crane --platform linux/arm64 append -b "$BASE" -f layer.tar -t "${IMAGE}:${TAG}"
          crane --platform linux/arm64 mutate "${IMAGE}:${TAG}" -t "${IMAGE}:${TAG}" \
            --entrypoint /app/server --workdir /app \
            -e PATH=/usr/lib/jellyfin-ffmpeg:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          # prove the config before anything points at it
          crane --platform linux/arm64 config "${IMAGE}:${TAG}" > config.json
          python3 - <<'PY'
          import json
          c = json.load(open("config.json"))
          cfg = c["config"]
          assert c["architecture"] == "arm64", c["architecture"]
          assert cfg.get("Entrypoint") == ["/app/server"], cfg.get("Entrypoint")
          assert cfg.get("WorkingDir") == "/app", cfg.get("WorkingDir")
          assert any(e.startswith("PATH=/usr/lib/jellyfin-ffmpeg:") for e in cfg.get("Env", [])), cfg.get("Env")
          print("cmd inherited from the base (the server reads no arguments):", cfg.get("Cmd"))
          PY
          crane tag "${IMAGE}:${TAG}" latest
          echo "pushed ${IMAGE}:${TAG} and :latest"

  # Writing the var is the whole deploy. Skipped, with a notice, until the
  # NOMAD_ADDR / NOMAD_TOKEN secrets exist — the image is pushed either
  # way, and RUNBOOK.md's by-hand write deploys it.
  #
  # `needs: build` and NOT the transcriber, on purpose: a whisper base
  # ghcr will not serve must never keep the server's image off the box.
  deploy:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Secrets present?
        id: gate
        run: |
          if [ -z "${NOMAD_ADDR}" ] || [ -z "${NOMAD_TOKEN}" ]; then
            echo "::notice::NOMAD_ADDR / NOMAD_TOKEN are not set on this repository; image pushed, deploy left to the RUNBOOK's by-hand write."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-nomad@v1.0.0
        if: steps.gate.outputs.go == 'true'

      - name: Point the job at the new image
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          # `put` REPLACES the variable, so read the worker's tag back and
          # carry it through; the transcriber job writes it again when its
          # own image lands. Empty — the first write, before the key
          # exists — means this sha: one commit, both images.
          keep=$(nomad var get -item transcriber_tag nomad/jobs/flickr/deploy 2>/dev/null || true)
          [ -n "$keep" ] || keep="$TAG"
          nomad var put -force nomad/jobs/flickr/deploy image_tag="$TAG" transcriber_tag="$keep" >/dev/null
          echo "deploying ${IMAGE}:${TAG} (transcriber_tag kept at ${keep})"

      - name: Watch the restart land
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          # the task restarts on the template change; wait for a running
          # alloc whose server task started after the write (up to 4 min)
          cat > started.py <<'PY'
          import sys, json, datetime
          best = 0
          for a in json.load(sys.stdin):
              if a.get("ClientStatus") != "running":
                  continue
              ts = a.get("TaskStates", {}).get("server", {})
              t = ts.get("StartedAt", "")
              if not t or ts.get("State") != "running":
                  continue
              t = t.split(".")[0].rstrip("Z")
              best = max(best, int(datetime.datetime.fromisoformat(t).replace(tzinfo=datetime.timezone.utc).timestamp()))
          print(best)
          PY
          since=$(date -u +%s)
          for i in $(seq 1 48); do
            started=$(nomad job allocs -json flickr 2>/dev/null | python3 started.py || echo 0)
            if [ "$started" -ge "$((since - 5))" ]; then
              echo "server task restarted at $(date -u -d @"$started" +%FT%TZ) on ${IMAGE}:${TAG}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::no running server task started after the deploy write within 4 minutes — the tag is written; check \`nomad job status flickr\` (a bad image restarts in a loop; roll back with an older tag from the registry)."
          exit 1

  # The whisper worker's image: the same COPY-only assembly, on the Vulkan
  # whisper.cpp base, for big-colt's amd64 AMD GPU. It reuses the server
  # build's tag, so one commit names one pair of images.
  transcriber:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: The registry is on the LAN
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://${REGISTRY}/v2/" || true)
          if [ "$code" != "200" ]; then
            echo "::error::https://${REGISTRY}/v2/ answered ${code}: this runner is not on the LAN (CI_RUNNER unset, or the registry allowlist changed). Nothing pushed."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # the build job's key, deliberately: the module cache and most of
      # the build cache are shared, so this cross-compile starts warm.
      - name: Cache Go modules, build cache and crane
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin/crane
          key: image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ env.CRANE_VERSION }}
          restore-keys: |
            image-${{ runner.os }}-${{ runner.arch }}-

      - name: Cross-compile the worker (linux/amd64, pure Go)
        run: |
          set -euo pipefail
          mkdir -p out/app
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags='-s -w' -o out/app/transcriber ./cmd/transcriber
          # one layer, one file. /app is the base's OWN directory — its
          # models/ and its build/bin/whisper-cli live there — so the
          # layer sets a binary down beside them and touches nothing else.
          # The mtime is the COMMIT's, like the server's layer.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
              -C out -cf layer.tar app/transcriber
          ls -l layer.tar

      - name: crane
        run: |
          set -euo pipefail
          if [ ! -x ~/go/bin/crane ] || [ "$(~/go/bin/crane version)" != "${CRANE_VERSION#v}" ]; then
            go install "github.com/google/go-containerregistry/cmd/crane@${CRANE_VERSION}"
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Assemble and push ${{ env.TRANSCRIBER_IMAGE }}:${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          # the same retry as the server's push: the whisper base is two
          # large layers, the very upload the registry has dropped before
          push() { local n; for n in 1 2 3; do "$@" && return 0; echo "push attempt $n failed; retrying in 20s"; sleep 20; done; "$@"; }
          push crane --platform linux/amd64 append -b "$TRANSCRIBER_BASE" -f layer.tar -t "${TRANSCRIBER_IMAGE}:${TAG}"
          # the base's entrypoint is `bash -c`; ours is the worker. PATH
          # keeps /app/build/bin first, where the base puts whisper-cli;
          # its runtime stage is ubuntu 24.04 and already carries ffmpeg,
          # so no other layer is appended.
          crane --platform linux/amd64 mutate "${TRANSCRIBER_IMAGE}:${TAG}" -t "${TRANSCRIBER_IMAGE}:${TAG}" \
            --entrypoint /app/transcriber --workdir /app \
            -e PATH=/app/build/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          # prove the config before anything points at it
          crane --platform linux/amd64 config "${TRANSCRIBER_IMAGE}:${TAG}" > config.json
          python3 - <<'PY'
          import json
          c = json.load(open("config.json"))
          cfg = c["config"]
          assert c["architecture"] == "amd64", c["architecture"]
          assert cfg.get("Entrypoint") == ["/app/transcriber"], cfg.get("Entrypoint")
          assert cfg.get("WorkingDir") == "/app", cfg.get("WorkingDir")
          assert any(e.startswith("PATH=/app/build/bin:") for e in cfg.get("Env", [])), cfg.get("Env")
          print("cmd inherited from the base (the worker reads env, not arguments):", cfg.get("Cmd"))
          PY
          crane tag "${TRANSCRIBER_IMAGE}:${TAG}" latest
          echo "pushed ${TRANSCRIBER_IMAGE}:${TAG} and :latest"

      - name: Secrets present?
        id: gate
        run: |
          if [ -z "${NOMAD_ADDR}" ] || [ -z "${NOMAD_TOKEN}" ]; then
            echo "::notice::NOMAD_ADDR / NOMAD_TOKEN are not set on this repository; worker image pushed, transcriber_tag left to the RUNBOOK's by-hand write."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-nomad@v1.0.0
        if: steps.gate.outputs.go == 'true'

      - name: Point the worker at the new image
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          # both keys again, because `put` replaces. The sha is the server
          # deploy's own, so image_tag comes back exactly as that job left
          # it however the two are ordered.
          nomad var put -force nomad/jobs/flickr/deploy image_tag="$TAG" transcriber_tag="$TAG" >/dev/null
          echo "deploying ${TRANSCRIBER_IMAGE}:${TAG}"

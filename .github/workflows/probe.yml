# Probes the DEPLOYED server from the LAN and reports what the root answers.
#
# The self-hosted `flickr` runners sit on the household network beside the
# box, and the CI token can read the flickr job, so this is the one place a
# session that cannot reach the LAN can still ask "is it up, and what does
# /api/ say?". On demand only: the Actions tab, or the API with a ref.
#
# Where the server is comes from, in order: the `url` input, the FLICKR_URL
# repository variable, or Nomad — the running allocation's address and its
# `http` port. Then three reads: the root document, the library, and the
# route resolver for `#/`, each with its status and content type, and the
# root's body so a refusal reads as the sentence it is. The job fails when
# the root is not a 200 JSON document. Nomad's job status and the task's
# recent stderr follow, best-effort (the token may not read logs).

name: probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL of the server (empty: FLICKR_URL variable, else discovered from Nomad)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
      URL_IN: ${{ inputs.url }}
      URL_VAR: ${{ vars.FLICKR_URL }}
    steps:
      - uses: hashicorp/setup-nomad@v1.0.0
        if: env.NOMAD_ADDR != '' && env.NOMAD_TOKEN != ''

      - name: Where is the server?
        id: where
        run: |
          set -uo pipefail
          url="${URL_IN:-${URL_VAR:-}}"
          alloc=""
          if [ -n "${NOMAD_ADDR:-}" ] && [ -n "${NOMAD_TOKEN:-}" ]; then
            cat > alloc.py <<'PY'
          import sys, json
          best = None
          for a in json.load(sys.stdin):
              if a.get("ClientStatus") != "running":
                  continue
              ts = a.get("TaskStates", {}).get("server", {})
              if ts.get("State") != "running":
                  continue
              if best is None or ts.get("StartedAt", "") > best[1]:
                  best = (a["ID"], ts.get("StartedAt", ""))
          print(best[0] if best else "")
          PY
            alloc=$(nomad job allocs -json flickr 2>/dev/null | python3 alloc.py || true)
            if [ -z "$url" ] && [ -n "$alloc" ]; then
              cat > addr.py <<'PY'
          import sys, json
          a = json.load(sys.stdin)
          res = a.get("AllocatedResources") or {}
          # the shared network first, then the task's own
          nets = (res.get("Shared") or {}).get("Networks") or []
          if not nets:
              for t in (res.get("Tasks") or {}).values():
                  nets = nets or (t.get("Networks") or [])
          for n in nets:
              ports = (n.get("DynamicPorts") or []) + (n.get("ReservedPorts") or [])
              ip = n.get("IP")
              pick = None
              for p in ports:
                  if p.get("Label") == "http":
                      pick = p
                      break
              if pick is None and ports:
                  pick = ports[0]
              if ip and pick:
                  print("http://%s:%s" % (ip, pick.get("Value")))
                  break
          PY
              url=$(nomad alloc status -json "$alloc" 2>/dev/null | python3 addr.py || true)
            fi
          fi
          if [ -z "$url" ]; then
            echo "::error::no server address: pass the url input, set the FLICKR_URL variable, or let Nomad answer (NOMAD_ADDR / NOMAD_TOKEN)."
            exit 1
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "alloc=$alloc" >> "$GITHUB_OUTPUT"
          echo "probing ${url%/} (alloc ${alloc:-unknown})"

      - name: The root, the library and the route
        env:
          URL: ${{ steps.where.outputs.url }}
        run: |
          set -uo pipefail
          fail=0
          read_one() {
            local path="$1"
            local out
            out=$(curl -sS -m 15 -o body.txt -w '%{http_code} %{content_type}' "$URL$path" 2>curl.err) || { echo "$path: curl failed: $(cat curl.err)"; return 1; }
            echo "$path: $out"
            return 0
          }
          if read_one "/api/"; then
            echo "--- root body (first 600 bytes) ---"; head -c 600 body.txt; echo; echo "---"
            status=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$URL/api/" || echo 000)
            if [ "$status" != "200" ] || ! python3 -c 'import json,sys; json.load(open("body.txt"))' 2>/dev/null; then
              echo "::error::the root is not a 200 JSON document (status $status)"; fail=1
            fi
          else
            fail=1
          fi
          read_one "/api/library" && python3 -c 'import json; d=json.load(open("body.txt")); print("library: %d tiles, bands %s" % (d.get("count",0), [b.get("key") for b in d.get("bands",[])]))' || true
          read_one "/api/-/route?hash=%23%2F" && python3 -c 'import json; d=json.load(open("body.txt")); print("route: view", d.get("view"))' || true
          read_one "/" >/dev/null && echo "/: $(head -c 80 body.txt | tr -d '\n')..." || true
          exit $fail

      - name: Nomad's view (best effort)
        if: always() && env.NOMAD_ADDR != '' && env.NOMAD_TOKEN != ''
        env:
          ALLOC: ${{ steps.where.outputs.alloc }}
        run: |
          nomad job status flickr 2>&1 | head -60 || true
          if [ -n "$ALLOC" ]; then
            echo "--- last 60 lines of the server task's stderr ---"
            nomad alloc logs -stderr -n 60 "$ALLOC" server 2>&1 || echo "(the CI token cannot read logs)"
          fi

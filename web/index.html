<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flickr — media PoC</title>
<meta name="theme-color" content="#14151a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/audio.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #14151a; color: #e8e8ea; }
  header { padding: 12px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #2a2c33; }
  header h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 600; }
  button, select, input[type=text] { background: #23252d; color: inherit; border: 1px solid #3a3d47; border-radius: 6px; padding: 6px 12px; font-size: 13px; }
  button, select { cursor: pointer; }
  button:hover { background: #2c2f38; }
  main { padding: 0; }
  .back { font-size: 13px; margin: 14px 0 0 20px; }

  /* profile gate */
  #gate { position: fixed; inset: 0; background: rgba(10,11,14,0.92); z-index: 100; display: flex; align-items: center; justify-content: center; }
  #gate-box { background: #1b1d24; border: 1px solid #2a2c33; border-radius: 12px; padding: 28px 32px; max-width: 420px; width: 92%; text-align: center; }
  #gate-box h2 { margin: 0 0 18px; font-size: 18px; font-weight: 600; }
  #gate-profiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
  #gate-profiles button { font-size: 15px; padding: 10px 18px; border-radius: 8px; }
  #gate-new { display: flex; gap: 8px; justify-content: center; }
  #gate-new input { flex: 1; }
  #gate-note { font-size: 11px; color: #9a9daa; margin-top: 12px; }
  #profile-chip { background: #1e2c42; color: #8db4f0; border-color: #2a3d5c; border-radius: 12px; }

  /* library grid */
  #lib-bar { display: flex; gap: 10px; align-items: center; padding: 16px 20px 0; }
  #search { width: 260px; max-width: 60vw; }
  #lib-count { font-size: 12px; color: #9a9daa; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; padding: 16px 20px 30px; }
  .card { cursor: pointer; }
  .card:hover .poster-wrap { outline: 2px solid #5b8def; }
  .poster-wrap { aspect-ratio: 2/3; width: 100%; border-radius: 8px; background: #1e2026; overflow: hidden; position: relative; }
  .poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster-wrap.text-tile { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; padding: 12px; text-align: center; background: linear-gradient(160deg, #232633, #191b22); }
  .text-tile .tile-title { font-size: 14px; font-weight: 600; color: #c5c8d4; word-break: break-word; }
  .text-tile .tile-sub { font-size: 11px; color: #9a9daa; }
  .card .c-title { font-size: 13px; margin-top: 8px; font-weight: 600; line-height: 1.3; }
  .card .c-sub { font-size: 11px; color: #9a9daa; margin-top: 2px; }
  .card .c-tech { font-size: 10px; color: #6f7280; margin-top: 2px; font-family: ui-monospace, monospace; }
  #empty { padding: 40px; color: #9a9daa; font-size: 14px; }
  #view-loading { padding: 40px; color: #9a9daa; font-size: 14px; }

  /* genre chip row */
  #genre-row { display: flex; gap: 8px; padding: 12px 20px 0; overflow-x: auto; scrollbar-width: thin; }
  #genre-row button { white-space: nowrap; border-radius: 14px; font-size: 12px; padding: 5px 14px; }
  #genre-row button.active { background: #2a4a8a; border-color: #3a5da8; color: #dbe6fa; }

  /* continue-watching row */
  #cw { padding: 14px 20px 0; }
  #cw h3 { font-size: 13px; color: #9a9daa; margin: 0 0 8px; font-weight: 600; }
  #cw-row { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 6px; }
  .cw-card { flex: 0 0 130px; cursor: pointer; }
  .cw-card:hover .poster-wrap { outline: 2px solid #5b8def; }
  .cw-card .poster-wrap { aspect-ratio: 2/3; border-radius: 8px; }
  .cw-card .cw-bar { height: 3px; background: #2a2c33; border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .cw-card .cw-bar > div { height: 100%; background: #5b8def; }
  .cw-card .c-title { font-size: 12px; margin-top: 5px; font-weight: 600; line-height: 1.3; }
  .cw-card .c-sub { font-size: 11px; color: #9a9daa; margin-top: 2px; }

  /* enriched episode rows */
  .item.enriched { display: flex; gap: 12px; align-items: flex-start; }
  .item.enriched img.still { width: 128px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; background: #1e2026; flex: 0 0 auto; }
  .item.enriched .overview { font-size: 12px; color: #9a9daa; margin-top: 3px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* show (episode list) view */
  #view-show h2 { margin: 14px 20px 6px; font-size: 18px; }
  #show-note, #lib-note { margin: 0 20px 8px; font-size: 13px; color: #f0b45c; }
  #episode-list, #extras-list { margin: 8px 20px 30px; border: 1px solid #2a2c33; border-radius: 8px; overflow: hidden; }
  #extras-head { margin: 18px 20px 0; font-size: 13px; color: #9a9daa; text-transform: uppercase; letter-spacing: .06em; }
  .item { padding: 10px 16px; border-bottom: 1px solid #1e2026; cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #1e222c; }
  .item .title { font-size: 14px; }
  .item .meta { font-size: 11px; color: #9a9daa; margin-top: 2px; }

  /* detail + player */
  #view-detail { padding: 0 20px 30px; }
  #detail-info { display: flex; gap: 22px; margin-top: 16px; flex-wrap: wrap; }
  #detail-poster { width: 180px; aspect-ratio: 2/3; border-radius: 8px; object-fit: cover; background: #1e2026; }
  #detail-body { flex: 1; min-width: 260px; }
  #detail-body h2 { margin: 0 0 4px; font-size: 22px; }
  #detail-year { color: #9a9daa; font-weight: 400; }
  #detail-overview { font-size: 14px; color: #c5c8d4; line-height: 1.5; max-width: 700px; margin: 10px 0; }
  #detail-tech { font-size: 12px; color: #9a9daa; font-family: ui-monospace, monospace; margin: 8px 0 14px; }
  #detail-play { font-size: 15px; padding: 9px 26px; background: #2a4a8a; border-color: #3a5da8; }
  #detail-play:hover { background: #33579e; }
  #detail-chapters { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  #detail-chapters button { font-size: 12px; padding: 4px 10px; }
  #detail-epnav { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  #detail-epnav a { background: #23252d; color: #c5c8d4; border: 1px solid #3a3d47;
    border-radius: 6px; padding: 6px 12px; font-size: 13px; text-decoration: none; }
  #detail-epnav a:hover { background: #2c2f38; }
  #detail-extras { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #detail-extras .label { font-size: 11px; color: #9a9daa; text-transform: uppercase; letter-spacing: .06em; }
  #detail-extras a { background: #23252d; color: #c5c8d4; border: 1px solid #3a3d47;
    border-radius: 6px; padding: 6px 12px; font-size: 13px; text-decoration: none; }
  #detail-extras a:hover { background: #2c2f38; }
  #now-playing { font-size: 15px; font-weight: 600; margin: 14px 0 10px; }

  #player-pane { margin-top: 6px; }
  /* reader pane (reader.js): a paper page in the dark UI, TOC alongside */
  #reader-pane { margin-top: 6px; display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 420px; }
  .rd-bar, .rd-nav { display: flex; gap: 10px; align-items: center; }
  .rd-bar { margin: 0 0 8px; }
  .rd-title { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-readout { font-size: 12px; color: #9a9daa; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rd-body { position: relative; flex: 1; min-height: 0; display: flex; }
  .rd-view { flex: 1; min-width: 0; background: #f4f1ea; border-radius: 8px; overflow: hidden; }
  .rd-fail { padding: 24px; color: #7a1f1f; font-size: 14px; }
  .rd-toc { width: 260px; max-width: 45vw; margin-right: 10px; overflow-y: auto; border: 1px solid #2a2c33; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .rd-toc button { text-align: left; font-size: 13px; padding: 6px 10px; border: 0; background: transparent; border-radius: 6px; }
  .rd-toc button:hover { background: #2c2f38; }
  .rd-toc button.current { background: #2a4a8a; color: #dbe6fa; }
  .rd-toc-empty { font-size: 12px; color: #9a9daa; padding: 8px; }
  .rd-nav { margin-top: 8px; justify-content: space-between; }
  .rd-nav button:disabled { opacity: .45; cursor: default; }
  .rd-msg { font-size: 13px; color: #f0b45c; flex: 1; text-align: center; }
  .rd-end { position: fixed; right: 24px; bottom: 24px; z-index: 60; background: #1b1d24; border: 1px solid #f0b45c;
    border-radius: 10px; padding: 14px 18px; max-width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
  .rd-end-title { font-size: 14px; font-weight: 600; }
  .rd-end-sub { font-size: 12px; color: #9a9daa; margin-top: 4px; }
  /* the PDF pane (pdfreader.js): one page on a canvas, fit to the width, scrolled when taller */
  .rd-pdf { overflow: auto; background: #3a3b40; padding: 6px; }
  .rd-canvas { display: block; margin: 0 auto; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.5); }
  .rd-page { font-size: 13px; color: #9a9daa; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rd-page-in { width: 64px; font-size: 13px; padding: 4px 6px; border-radius: 6px; border: 1px solid #2a2c33; background: #14151a; color: inherit; }
  .rd-end button { margin-top: 10px; margin-right: 8px; }
  .rd-keep { background: #2a4a8a; border-color: #3a5da8; }
  .rd-keep:hover { background: #33579e; }
  video { width: 100%; max-height: 58vh; background: #000; border-radius: 8px; }
  body.casting video { opacity: 0.25; }
  #cast-overlay { display: none; font-size: 14px; color: #8db4f0; margin: 6px 0; }
  body.casting #cast-overlay { display: block; }
  #scrub { position: relative; height: 22px; margin: 10px 0 2px; cursor: pointer; }
  #scrub .rail { position: absolute; left: 0; right: 0; top: 8px; height: 6px; background: #2a2c33; border-radius: 3px; }
  #scrub .avail { position: absolute; left: 0; top: 8px; height: 6px; background: #3d4250; border-radius: 3px; width: 0; }
  #scrub .fill { position: absolute; left: 0; top: 8px; height: 6px; background: #5b8def; border-radius: 3px; width: 0; }
  #scrub .tick { position: absolute; top: 6px; width: 2px; height: 10px; background: #8a92a8; border-radius: 1px; }
  /* passage bounds: amber flags pointing into the passage — taller and
     coloured so they cannot be mistaken for chapter ticks */
  #scrub .bound { position: absolute; top: 2px; width: 3px; height: 18px; background: #f0b45c; border-radius: 2px; transform: translateX(-50%); z-index: 2; }
  #scrub .bound::after { content: ''; position: absolute; top: 0; width: 6px; height: 5px; background: #f0b45c; }
  #scrub .bound.start::after { left: 3px; border-radius: 0 3px 3px 0; }
  #scrub .bound.end::after { right: 3px; border-radius: 3px 0 0 3px; }
  #thumb { position: absolute; bottom: 26px; transform: translateX(-50%); z-index: 5; pointer-events: none; text-align: center; }
  #thumb-img { background-color: #000; background-repeat: no-repeat; border: 1px solid #3a3d47; border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
  #thumb-time { display: inline-block; margin-top: 3px; font-size: 11px; padding: 1px 7px; border-radius: 8px; background: rgba(20,21,26,0.9); color: #c5c8d4; font-variant-numeric: tabular-nums; }
  #timebar { display: flex; justify-content: space-between; font-size: 12px; color: #9a9daa; font-variant-numeric: tabular-nums; }
  #controls { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  #controls button { min-width: 42px; }
  #controls input[type=range] { width: 110px; accent-color: #5b8def; }
  /* making a passage: the in/out chips turn amber like the .bound flags once
     set and grow a small × that clears the mark */
  #controls .markchip { display: inline-flex; }
  #controls .markchip button { font-variant-numeric: tabular-nums; }
  #controls .markchip .mark-clear { min-width: 0; padding: 6px 8px; border-left: 0; border-radius: 0 6px 6px 0; color: #9a9daa; }
  #controls .markchip .mark-clear:hover { color: #f08080; }
  #controls .markchip.set button { border-color: #a37a30; color: #f0b45c; }
  #controls .markchip.set button:first-child { border-radius: 6px 0 0 6px; background: #2e2616; }
  #controls .markchip.set button:first-child:hover { background: #3a3019; }
  /* the minted link, as text too (a phone with no clipboard API long-presses it) */
  #passage-link { margin-top: 8px; font-size: 12px; color: #9a9daa; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  #passage-link .copied { color: #6ee7a0; }
  #passage-link code { user-select: all; -webkit-user-select: all; word-break: break-all; color: #c5c8d4;
    background: #1b1d24; border: 1px solid #3a3d47; border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  google-cast-launcher { width: 28px; height: 28px; cursor: pointer; --connected-color: #5b8def; --disconnected-color: #9a9daa; }
  #chapters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #chapters button { font-size: 12px; padding: 4px 10px; }
  #status { font-size: 13px; color: #9a9daa; margin: 10px 0; }
  /* up-next auto-advance overlay */
  #upnext { position: fixed; right: 24px; bottom: 24px; z-index: 60; background: #1b1d24; border: 1px solid #3a3d47;
    border-radius: 10px; padding: 14px 18px; max-width: 340px; cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
  #upnext:hover { border-color: #5b8def; }
  #upnext-title { font-size: 14px; font-weight: 600; }
  #upnext-count { font-size: 12px; color: #9a9daa; margin-top: 4px; font-variant-numeric: tabular-nums; }
  #upnext-cancel { margin-top: 10px; }
  #upnext-play { margin-top: 10px; margin-right: 8px; background: #2a4a8a; border-color: #3a5da8; }
  #upnext-play:hover { background: #33579e; }
  /* end-of-passage panel: paused at the bound, two ways out */
  #player-pane { position: relative; }
  #tap-to-play { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); z-index: 55;
    font-size: 20px; padding: 14px 26px; border-radius: 999px; background: #2a4a8a; border: 1px solid #3a5da8; color: #fff; cursor: pointer; }
  #tap-to-play:hover { background: #33579e; }
  #passage-end { position: fixed; right: 24px; bottom: 24px; z-index: 60; background: #1b1d24; border: 1px solid #f0b45c;
    border-radius: 10px; padding: 14px 18px; max-width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
  #passage-end-title { font-size: 14px; font-weight: 600; }
  #passage-end-sub { font-size: 12px; color: #9a9daa; margin-top: 4px; font-variant-numeric: tabular-nums; }
  #passage-keep { margin-top: 10px; margin-right: 8px; background: #2a4a8a; border-color: #3a5da8; }
  #passage-keep:hover { background: #33579e; }
  #passage-back { margin-top: 10px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-right: 6px; }
  .badge.direct { background: #14432a; color: #6ee7a0; }
  .badge.transcode { background: #4a3413; color: #f0b45c; }
  .badge.deny { background: #4a1a1a; color: #f08080; }
  #trace { margin-top: 14px; font-size: 13px; }
  #trace h3 { font-size: 13px; color: #9a9daa; margin: 14px 0 6px; }
  .step { display: flex; gap: 8px; padding: 3px 0; font-family: ui-monospace, monospace; font-size: 12px; }
  .step .mark { width: 16px; }
  .step.pass .mark { color: #6ee7a0; }
  .step.fail .mark { color: #f08080; }
  .step .check { width: 130px; color: #c5c8d4; }
  .step .detail { color: #9a9daa; }
</style>
</head>
<body>
<header>
  <h1>flickr <span style="color:#9a9daa;font-weight:400">— media server PoC</span></h1>
  <button id="profile-chip" title="Switch profile">…</button>
  <label style="font-size:12px;color:#9a9daa">Play as:</label>
  <select id="profile">
    <option value="browser">This browser (detected)</option>
    <option value="chromecast1">Chromecast v1 (h264/1080p only)</option>
    <option value="chromecastUltra">Chromecast Ultra (4K, hevc/vp9, HDR)</option>
    <option value="tv4k">4K HDR TV (hevc, hdr10)</option>
    <option value="cellular">Phone on cellular (3 Mbps cap)</option>
  </select>
  <button id="scan">Scan library</button>
  <span id="scan-status" style="font-size:12px;color:#9a9daa"></span>
  <span id="hw" title="" style="font-size:11px;padding:2px 8px;border-radius:10px;background:#1e2c42;color:#8db4f0;cursor:help"></span>
</header>

<!-- profile gate -->
<div id="gate" hidden>
  <div id="gate-box">
    <h2>Who's watching?</h2>
    <div id="gate-profiles"></div>
    <div id="gate-new">
      <input type="text" id="gate-name" placeholder="New profile name" maxlength="40">
      <button id="gate-create">Create</button>
    </div>
    <div id="gate-note"></div>
  </div>
</div>

<main>
  <!-- route loading (deep link waiting on /api/items) -->
  <div id="view-loading" hidden>Loading…</div>

  <!-- library: poster grid -->
  <div id="view-library">
    <div id="lib-note" hidden></div>
    <div id="genre-row" hidden></div>
    <div id="cw" hidden>
      <h3>Continue watching</h3>
      <div id="cw-row"></div>
    </div>
    <div id="lib-bar">
      <input type="text" id="search" placeholder="Search titles…">
      <span id="lib-count"></span>
    </div>
    <div id="grid"><div id="empty">No items yet — run a scan.</div></div>
  </div>

  <!-- show: episode list -->
  <div id="view-show" hidden>
    <button class="back" id="show-back">← Library</button>
    <h2 id="show-title"></h2>
    <div id="show-note" hidden></div>
    <div id="episode-list"></div>
    <div id="extras-head" hidden>Extras</div>
    <div id="extras-list" hidden></div>
  </div>

  <!-- artist: the shelf of albums under one name (web/audio.js fills it) -->
  <div id="view-artist" hidden></div>

  <!-- detail + player -->
  <div id="view-detail" hidden>
    <button class="back" id="detail-back">← Back</button>
    <div id="detail-info">
      <img id="detail-poster" alt="">
      <div id="detail-body">
        <h2><span id="detail-title"></span> <span id="detail-year"></span></h2>
        <p id="detail-overview"></p>
        <div id="detail-tech"></div>
        <button id="detail-play">▶ Play</button>
        <div id="detail-chapters"></div>
        <div id="detail-epnav" hidden></div>
        <div id="detail-extras" hidden></div>
      </div>
    </div>
    <!-- audio: cover, title, author and the work's parts or tracks (web/audio.js) -->
    <div id="audio-pane" hidden>
      <div id="audio-head">
        <img id="audio-cover" alt="">
        <div>
          <div id="audio-title"></div>
          <div id="audio-author"></div>
          <div id="audio-part"></div>
        </div>
      </div>
      <div id="audio-list-head" hidden></div>
      <div id="audio-list" hidden></div>
    </div>
    <div id="player-pane" hidden>
      <div id="now-playing"></div>
      <video id="video" controls></video>
      <!-- autoplay refused (a fresh tab, no gesture yet): the one tap the
           browser wants, said out loud instead of a silent paused player -->
      <button id="tap-to-play" hidden>▶ Tap to play</button>
      <div id="cast-overlay">▶ Casting to <span id="cast-device"></span></div>
      <div id="scrub"><div class="rail"></div><div class="avail"></div><div class="fill"></div><div id="thumb" hidden><div id="thumb-img"></div><div id="thumb-time"></div></div></div>
      <div id="timebar"><span id="t-now">0:00</span><span id="t-total">0:00</span></div>
      <div id="controls">
        <button id="btn-prev-ep" hidden>⏮ Prev</button>
        <button id="btn-play" title="Play/Pause">⏵</button>
        <button id="btn-back" title="Back 10s">⏪</button>
        <button id="btn-fwd" title="Forward 30s">⏩</button>
        <button id="btn-stop" title="Stop">⏹</button>
        <button id="btn-next-ep" hidden>Next ⏭</button>
        <span style="font-size:12px;color:#9a9daa">vol</span>
        <input type="range" id="vol" min="0" max="1" step="0.05" value="1">
        <select id="subs" title="Subtitles" style="display:none"></select>
        <select id="audio" title="Audio track" style="display:none"></select>
        <button id="btn-autoplay"></button>

<script>
// ---------------------------------------------------------------------------
// identity: clientId IS the profile name (progress API is keyed by it)
// ---------------------------------------------------------------------------
let clientId = localStorage.profileName || null;
let usersApiLive = true;   // false => /api/users 404'd, localStorage-only profiles
let hls = null, sessionId = null, currentItem = null, seekOffset = 0, method = null;
let baseUrl = location.origin, remotePlayer = null, remoteController = null;
let allItems = [], currentShow = null, detailItem = null;
// The server's own picture of the library, and of the work on screen. The
// grid draws GET /api/library's tiles in the order that document lists them,
// and every list this page used to regroup by hand — a show's episodes, a
// film's bonus material, an album's tracks, the neighbours up-next walks — is
// read off the work document (GET /api/works/{key}). allItems survives only
// for the fields those documents do not carry yet (media_info, identity),
// which step 6 of docs/hypermedia.md takes away.
let libraryDoc = null, currentWork = null;
let itemsLoaded = false, itemsReady = null; // deep links await the library fetch
let selectedSubOrdinal = null; // per-session TEXT subtitle choice, default Off
let burnSubOrdinal = null;     // embedded bitmap track burned in server-side (subtitle_burn)
let selectedAudioOrdinal = null; // per-session audio-track choice, sent as audio_track in /play
let activeGenre = null; // genre chip filter, null = All
// episode navigation / auto-advance state
let pendingPlay = null;         // { id, mode: 'nav' | 'zero' } — consumed by applyRoute after a prev/next/auto-advance route replace
let upNextTimer = null, upNextTarget = null; // auto-advance countdown
let castLastState = null;       // last seen RemotePlayer.playerState (fire end-detection on transitions only)
let castEndSuppressed = false;  // our own stop/load in flight: IDLE isn't a natural end
let endFired = false;           // one natural-end per stream load (re-armed on seeking back)
// The SESSION DOCUMENT of the current play (docs/hypermedia.md §Passages
// are session state): what /api/items/{id}/play answered — the url, the
// decision, the passage resolved, the marks, and the actions this player
// may take (progress, keep_watching, stop, next, mark_in, mark_out, link).
// The client composes no URL of its own from it: it follows what is there.
let session = null;
// passage session (see passage.js and README "Deep links and passages"):
// { t, end, until, from, to } while the player is inside a passage, null in
// normal viewing. The clock is the client's, so this is what the end
// predicates read; the RULES are the server's — a progress write during a
// passage is refused with 409, and keep_watching is the way out.
let passage = null;
let swReloadPending = false; // a new service worker took control mid-stream; reload when the player closes
let passageEndFired = false;    // the end bound (or the run's last item) has been reached and the panel shown
let passageNaturalEnd = false;  // …by the item ending on its own rather than by the `end` bound
// Making a passage is the SERVER's now: the marks live on the session
// document (session.marks — { in, out }, each { item_id, seconds }), the
// snap to a chapter and the swap of a backwards pair happen there, and
// actions.link mints the link and the sentence that says it. The chips
// below only post the marks and render what comes back.
const video = document.getElementById('video');
const scrub = document.getElementById('scrub');
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function detectBrowserCaps() {
  const v = document.createElement('video');
  const codecs = ['h264'];
  if (v.canPlayType('video/mp4; codecs="hev1.1.6.L93.B0"')) codecs.push('hevc');
  if (v.canPlayType('video/mp4; codecs="av01.0.05M.08"')) codecs.push('av1');
  return {
    schema_version: 1,
    containers: ['mp4', 'webm', 'm4v', 'm4a', 'm4b', 'mp3', 'flac', 'ogg', 'opus', 'wav'],
    video_codecs: codecs,
    audio_codecs: ['aac', 'mp3', 'opus', 'flac', 'vorbis'],
    max_width: 3840, max_height: 2160,
    max_audio_channels: 2,
    hls_segment_formats: ['ts', 'fmp4'],
    hls_audio_codecs: ['aac', 'mp3'],
  };
}

const profiles = {
  browser: detectBrowserCaps(),
  chromecast1: {
    schema_version: 1, containers: ['mp4'], video_codecs: ['h264'],
    audio_codecs: ['aac', 'mp3'], max_width: 1920, max_height: 1080, max_audio_channels: 2,
    hls_segment_formats: ['ts'], hls_audio_codecs: ['aac'],
  },
  chromecastUltra: {
    schema_version: 1, containers: ['mp4', 'webm'],
    video_codecs: ['h264', 'hevc', 'vp9'],
    audio_codecs: ['aac', 'mp3', 'opus', 'flac', 'vorbis', 'ac3', 'eac3'],
    max_width: 3840, max_height: 2160,
    supports_hdr: ['hdr10', 'dolbyvision'], max_audio_channels: 6,
    // Measured, not from the spec sheet: the Ultra direct-plays an HEVC
    // file fine, and its HLS player never starts on HEVC in fMP4 segments.
    hls_segment_formats: ['ts', 'fmp4'], hls_audio_codecs: ['aac'],
    hls_video_codecs: ['h264'],
  },
  tv4k: {
    schema_version: 1, containers: ['mp4', 'mkv'], video_codecs: ['h264', 'hevc', 'av1'],
    audio_codecs: ['aac', 'ac3', 'eac3'], max_width: 3840, max_height: 2160,
    supports_hdr: ['hdr10', 'hlg'], max_audio_channels: 8,
    hls_segment_formats: ['ts', 'fmp4'], hls_audio_codecs: ['aac', 'ac3', 'eac3'],
  },
  cellular: {
    schema_version: 1, containers: ['mp4'], video_codecs: ['h264'],
    audio_codecs: ['aac'], max_width: 1280, max_height: 720,
    max_bitrate_bps: 3000000, max_audio_channels: 2,
    hls_segment_formats: ['ts'], hls_audio_codecs: ['aac'],
  },
};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  // A refusal is an answer: a problem+json says it in `detail` (or `title`)
  // and names a remedy; the older routes say it in `error`.
  if (!r.ok) {
    const e = new Error(body.error || body.detail || body.title || r.statusText);
    e.status = r.status; e.problem = body;
    throw e;
  }
  return body;
}

function fmtSize(n) { return n < 1e9 ? (n / 1e6).toFixed(0) + ' MB' : (n / 1e9).toFixed(2) + ' GB'; }
function fmtRes(mi) {
  if (mi?.medium === 'audio') return `${mi.audio_codec}${mi.audio_channels ? ' ' + mi.audio_channels + 'ch' : ''}`; // no picture to size
  if (mi && mi.medium && mi.medium !== 'video') return mi.medium; // text: no picture to size either
  return mi ? `${mi.width}x${mi.height} ${mi.video_codec}/${mi.audio_codec}${mi.hdr ? ' ' + mi.hdr.toUpperCase() : ''}` : 'probe failed';
}
function fmtTime(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
}
function baseName(key) { return String(key || '').split('/').pop(); }
function itemTitle(it) {
  const t = it.enrichment?.title || it.identity?.title || baseName(it.object_key);
  if (it.identity?.kind === 'episode') {
    return it.identity.episode > 0
      ? `${t} S${seasonOf(it)}E${it.identity.episode}` : `${t} — ${baseName(it.object_key)}`;
  }
  if (it.identity?.kind === 'extra') return `${t} — ${baseName(it.object_key)}`;
  return it.enrichment?.year ? `${t} (${it.enrichment.year})` :
         it.identity?.year ? `${t} (${it.identity.year})` : t;
}
function displayTitle(it) {
  return it.enrichment?.title || it.identity?.title || baseName(it.object_key);
}
function techLine(it) {
  const mi = it.media_info;
  return `${fmtRes(mi)} · ${fmtSize(it.size)}${mi?.chapters?.length ? ` · ${mi.chapters.length} ch` : ''}${mi?.page_count ? ` · ${mi.page_count} p.` : ''}`;
}

// ---------------------------------------------------------------------------
// profile gate (Task A)
// ---------------------------------------------------------------------------
async function fetchProfiles() {
  try {
    const users = await api('/api/users');
    usersApiLive = true;
    return users.map(u => u.name).filter(Boolean);
  } catch (e) {
    usersApiLive = false; // old server: keep profiles in localStorage only
    return JSON.parse(localStorage.localProfiles || '[]');
  }
}

async function openGate() {
  $('gate').hidden = false;
  $('gate-profiles').innerHTML = '<span style="color:#9a9daa;font-size:13px">loading…</span>';
  const names = await fetchProfiles();
  $('gate-note').textContent = usersApiLive
    ? '' : 'Server has no profile support yet — profiles are stored in this browser only.';
  const box = $('gate-profiles');
  box.innerHTML = names.length ? '' : '<span style="color:#9a9daa;font-size:13px">No profiles yet — create one below.</span>';
  for (const name of names) {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => selectProfile(name);
    box.appendChild(b);
  }
}

async function createProfile(name) {
  name = name.trim();
  if (!name) return;
  let stored = false;
  try {
    await api('/api/users', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    stored = true;
  } catch (e) {
    if (e.status === 409 || /exist/i.test(e.message)) stored = true; // duplicate is fine
  }
  if (!stored) { // old server (or offline): keep the profile in this browser
    const l = JSON.parse(localStorage.localProfiles || '[]');
    if (!l.includes(name)) l.push(name);
    localStorage.localProfiles = JSON.stringify(l);
  }
  selectProfile(name);
}

function selectProfile(name) {
  clientId = name;
  localStorage.profileName = name;
  $('profile-chip').textContent = '👤 ' + name;
  $('gate').hidden = true;
  renderContinueWatching(); // row is per-profile
}

$('gate-create').onclick = () => createProfile($('gate-name').value);
$('gate-name').onkeydown = e => { if (e.key === 'Enter') createProfile($('gate-name').value); };
$('profile-chip').onclick = openGate;

// ---------------------------------------------------------------------------
// cast plumbing
// ---------------------------------------------------------------------------
function casting() { return !!(remotePlayer && remotePlayer.isConnected); }

window.__onGCastApiAvailable = (ok) => { if (ok) initCast(); };
function initCast() {
  const ctx = cast.framework.CastContext.getInstance();
  ctx.setOptions({
    // Task E: a registered custom receiver app id (pointing at /receiver.html)
    // can be dropped into localStorage.castAppId; default receiver otherwise.
    receiverApplicationId: localStorage.castAppId || chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
    autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
  });
  remotePlayer = new cast.framework.RemotePlayer();
  remoteController = new cast.framework.RemotePlayerController(remotePlayer);
  remoteController.addEventListener(
    cast.framework.RemotePlayerEventType.IS_CONNECTED_CHANGED, onCastConnectionChanged);
  remoteController.addEventListener(
    cast.framework.RemotePlayerEventType.PLAYER_STATE_CHANGED, onCastPlayerState);
}

// Cast end-detection: a natural end is a transition to IDLE whose media
// session reports idleReason FINISHED. Our own stop/load-next also lands in
// IDLE (CANCELLED/INTERRUPTED) — castEndSuppressed guards the window where
// we caused it ourselves, and clears once playback is demonstrably running.
function onCastPlayerState() {
  syncPlayButton();
  const st = remotePlayer.playerState;
  if (st === castLastState) return;
  const prev = castLastState;
  castLastState = st;
  // Resumed (from the device or its own remote) while paused at the end of
  // a passage: the person chose to keep watching.
  if (st === 'PLAYING' && prev === 'PAUSED' && passageEndFired && !passageNaturalEnd) keepWatching();
  if (st === 'PLAYING' || st === 'BUFFERING' || st === 'PAUSED') { castEndSuppressed = false; return; }
  if (st !== 'IDLE' || castEndSuppressed || !currentItem) return;
  const ms = cast.framework.CastContext.getInstance().getCurrentSession()?.getMediaSession();
  if (ms && ms.idleReason === 'FINISHED') onPlaybackEnded();
}

function onCastConnectionChanged() {
  document.body.classList.toggle('casting', casting());
  if (casting()) {
    const dev = cast.framework.CastContext.getInstance().getCurrentSession()?.getCastDevice();
    $('cast-device').textContent = dev?.friendlyName || 'Chromecast';
    video.pause();
  }
  // Hand playback over in either direction, keeping the position.
  if (currentItem) {
    const pos = position();
    startPlayback(currentItem, pos > 5 ? pos : 0);
  }
}

async function castLoad(url, isHls, title, resumeForDirect, segFormat, item) {
  castEndSuppressed = true; // loading interrupts the old media session: not a natural end
  const abs = url.startsWith('/') ? baseUrl + url : url;
  const media = new chrome.cast.media.MediaInfo(abs, isHls ? 'application/x-mpegurl' : 'video/mp4');
  if (isHls) {
    const fmp4 = segFormat === 'fmp4';
    media.hlsSegmentFormat = fmp4 ? chrome.cast.media.HlsSegmentFormat.FMP4
                                  : chrome.cast.media.HlsSegmentFormat.TS;
    media.hlsVideoSegmentFormat = fmp4 ? chrome.cast.media.HlsVideoSegmentFormat.FMP4
                                       : chrome.cast.media.HlsVideoSegmentFormat.TS;
    media.streamType = chrome.cast.media.StreamType.BUFFERED;
  }
  media.metadata = new chrome.cast.media.GenericMediaMetadata();
  media.metadata.title = title;

  // Task D (cast): expose supported subtitle tracks; trackId = ordinal + 1.
  const subs = supportedSubs(item);
  if (subs.length) {
    media.tracks = subs.map(s => {
      const t = new chrome.cast.media.Track(s.ordinal + 1, chrome.cast.media.TrackType.TEXT);
      t.trackContentId = baseUrl + `/api/items/${item.id}/subtitles/${s.ordinal}.vtt`;
      t.trackContentType = 'text/vtt';
      t.subtype = chrome.cast.media.TextTrackType.SUBTITLES;
      t.name = subLabel(s);
      t.language = s.language || 'en';
      return t;
    });
  }
  const req = new chrome.cast.media.LoadRequest(media);
  if (subs.length) {
    req.activeTrackIds = (selectedSubOrdinal != null && subs.some(s => s.ordinal === selectedSubOrdinal))
      ? [selectedSubOrdinal + 1] : [];
  }
  // HLS sessions are already positioned server-side; pin to 0 so the
  // receiver doesn't jump to the live edge of the growing playlist. Either
  // way a passage's start (`t`) arrives here as the seek, so the receiver
  // starts where the passage starts.
  req.currentTime = isHls ? 0 : (resumeForDirect > 0 ? resumeForDirect : 0);
  req.autoplay = true;
  await cast.framework.CastContext.getInstance().getCurrentSession().loadMedia(req);
}

// ---------------------------------------------------------------------------
// unified player state
// ---------------------------------------------------------------------------
function duration() { return currentItem?.media_info?.duration_seconds || video.duration || 0; }
function position() {
  const t = casting() ? (remotePlayer.currentTime || 0) : (video.currentTime || 0);
  return seekOffset + t;
}
function availableEnd() {
  if (method !== 'transcode') return duration();
  const end = casting()
    ? (remotePlayer.duration > 0 ? remotePlayer.duration : 0)
    : (video.seekable.length ? video.seekable.end(video.seekable.length - 1) : 0);
  return seekOffset + end;
}
function isPlaying() {
  return casting() ? remotePlayer.playerState === 'PLAYING' : (!video.paused && !video.ended);
}

// ---------------------------------------------------------------------------
// subtitles (Task D)
// ---------------------------------------------------------------------------
function supportedSubs(item) {
  return (item?.media_info?.subtitles || []).filter(s => s.supported);
}
// Embedded bitmap tracks (PGS/VobSub): not convertible to WebVTT, but the
// server can burn them into the picture. External sidecars never qualify.
function burnableSubs(item) {
  return (item?.media_info?.subtitles || []).filter(s => !s.supported && !s.external);
}
function subLabel(s) {
  return s.title && s.language ? `${s.title} (${s.language})` : (s.title || s.language || 'Track ' + s.ordinal);
}
function burnLabel(s) {
  const codec = { hdmv_pgs_subtitle: 'PGS', dvd_subtitle: 'DVD', dvb_subtitle: 'DVB' }[s.codec]
    || (s.codec || '?').toUpperCase();
  return `${s.language || s.title || 'Track ' + s.ordinal} · ${codec} (burned-in)`;
}

function renderSubSelector(item) {
  const sel = $('subs');
  const subs = supportedSubs(item);
  const burns = burnableSubs(item);
  if (!subs.length && !burns.length) {
    sel.style.display = 'none'; selectedSubOrdinal = null; burnSubOrdinal = null; return;
  }
  sel.style.display = '';
  sel.innerHTML = '<option value="">Subtitles: Off</option>' +
    subs.map(s => `<option value="${s.ordinal}">${esc(subLabel(s))}${s.external ? ' [ext]' : ''}</option>`).join('') +
    burns.map(s => `<option value="burn:${s.ordinal}">${esc(burnLabel(s))}</option>`).join('');
  if (selectedSubOrdinal != null && !subs.some(s => s.ordinal === selectedSubOrdinal)) {
    selectedSubOrdinal = null; // previous choice doesn't exist on this item
  }
  if (burnSubOrdinal != null && !burns.some(s => s.ordinal === burnSubOrdinal)) {
    burnSubOrdinal = null;
  }
  sel.value = burnSubOrdinal != null ? 'burn:' + burnSubOrdinal
            : selectedSubOrdinal == null ? '' : String(selectedSubOrdinal);
}

// (Re-)attach <track> elements for local playback. Called on every
// startPlayback, which also covers transcode seek-restarts.
function attachLocalTracks(item) {
  video.querySelectorAll('track').forEach(t => t.remove());
  for (const s of supportedSubs(item)) {
    const tr = document.createElement('track');
    tr.kind = 'subtitles';
    tr.src = `/api/items/${item.id}/subtitles/${s.ordinal}.vtt`;
    tr.srclang = s.language || '';
    tr.label = subLabel(s);
    tr.dataset.ordinal = s.ordinal;
    video.appendChild(tr);
  }
  applyLocalSubSelection();
}
function applyLocalSubSelection() {
  for (const tr of video.querySelectorAll('track')) {
    tr.track.mode = (selectedSubOrdinal != null && Number(tr.dataset.ordinal) === selectedSubOrdinal)
      ? 'showing' : 'disabled';
  }
}

// Restart the stream at the current position — burning a subtitle or
// switching the audio track changes the stream itself, so the seek-restart
// machinery (startPlayback with a seek offset) is reused.
function restartFromCurrent() {
  if (!currentItem || method === null) return;
  const t = position();
  $('status').textContent = `Restarting stream at ${fmtTime(t)}…`;
  startPlayback(currentItem, t);
}

$('subs').onchange = () => {
  const v = $('subs').value;
  if (v.startsWith('burn:')) {
    // Bitmap track: burned server-side; hide any local text track and
    // restart so the new stream carries the subtitles.
    selectedSubOrdinal = null;
    applyLocalSubSelection();
    const ord = Number(v.slice(5));
    if (ord !== burnSubOrdinal) { burnSubOrdinal = ord; restartFromCurrent(); }
    return;
  }
  selectedSubOrdinal = v === '' ? null : Number(v);
  if (burnSubOrdinal != null) {
    // Leaving a burn (to Off or a text track): the burned-in stream must be
    // replaced; the restart re-applies the text selection on load.
    burnSubOrdinal = null;
    restartFromCurrent();
    return;
  }
  if (casting()) {
    const ms = cast.framework.CastContext.getInstance().getCurrentSession()?.getMediaSession();
    if (ms) {
      const ids = selectedSubOrdinal == null ? [] : [selectedSubOrdinal + 1];
      ms.editTracksInfo(new chrome.cast.media.EditTracksInfoRequest(ids),
        () => {}, e => console.warn('editTracksInfo failed', e));
    }
  } else {
    applyLocalSubSelection();
  }
};

// ---------------------------------------------------------------------------
// audio tracks (contract: media_info.audio_tracks; selection is forward-compat
// only — sent as "audio_track" in /play, ignored by today's server)
// ---------------------------------------------------------------------------
function audioTracks(item) {
  return (item?.media_info?.audio_tracks || []).filter(t => t && t.ordinal != null);
}
function audioLabel(t) {
  const ch = t.channels === 6 ? '5.1' : t.channels === 8 ? '7.1' : t.channels ? t.channels + 'ch' : '';
  return [t.language || t.title || 'Track ' + t.ordinal,
          t.title && t.language ? t.title : null,
          t.codec, ch].filter(Boolean).join(' · ');
}
function renderAudioSelector(item) {
  const sel = $('audio');
  const tracks = audioTracks(item);
  if (tracks.length < 2) { sel.style.display = 'none'; selectedAudioOrdinal = null; return; }
  sel.style.display = '';
  sel.innerHTML = tracks.map(t =>
    `<option value="${t.ordinal}">${esc(audioLabel(t))}</option>`).join('');
  if (selectedAudioOrdinal == null || !tracks.some(t => t.ordinal === selectedAudioOrdinal)) {
    selectedAudioOrdinal = (tracks.find(t => t.default) || tracks[0]).ordinal;
  }
  sel.value = String(selectedAudioOrdinal);
}
$('audio').onchange = () => {
  const v = $('audio').value;
  const ord = v === '' ? null : Number(v);
  if (ord === selectedAudioOrdinal) return;
  selectedAudioOrdinal = ord;
  // The server maps the chosen stream into the transcode (audio_track in the
  // /play body), so switching mid-play means a new stream: restart in place.
  restartFromCurrent();
};

// ---------------------------------------------------------------------------
// the library document (GET /api/library) and the work document
// (GET /api/works/{key})
// ---------------------------------------------------------------------------
// The browser used to regroup /api/items into shows, albums and artists on
// every render — a second copy of works.Build and works.Artists, in another
// language, drifting from them. It does not any more: the server says what
// the tiles are and in what order (cmd/server/library.go), and what a work's
// members are and in what order (the work document). What is left here is
// the fetching, the remembering and the drawing.
function isExtra(it) { return it?.identity?.kind === 'extra'; }
function itemById(id) { return allItems.find(i => i.id === id) || null; }
// Who is asking, spelled for a query string. The profile NAME is the
// client_id everywhere in this API.
function profileParam() { return encodeURIComponent(clientId || 'anonymous'); }

// One work as this page holds it: the document's own fields, and its members
// resolved back to the items allItems still carries — a member envelope does
// not carry media_info or identity yet, and the panes below still read both.
function workFromDoc(doc) {
  const members = doc.members || [];
  return {
    href: doc.self, key: doc.work_key, kind: doc.work_kind, title: doc.title,
    author: doc.author || '', year: doc.year || 0,
    artwork: (doc.links?.cover || doc.links?.poster)?.href || '',
    items: members.map(m => itemById(m.id)).filter(Boolean),
    duration: members.reduce((s, m) => s + (m.duration_seconds || 0), 0),
  };
}

const workDocs = new Map();  // work href -> its document
const itemWorks = new Map(); // item id   -> the href of the work it belongs to
function forgetWorks() { workDocs.clear(); itemWorks.clear(); }

// A work document, fetched once. Every member it names is remembered as
// belonging to it, so a show's episodes cost one fetch between them.
async function loadWork(href) {
  if (!href) return null;
  let doc = workDocs.get(href);
  if (!doc) {
    doc = await api(href + (href.includes('?') ? '&' : '?') + 'client_id=' + profileParam());
    workDocs.set(href, doc);
  }
  for (const m of doc.members || []) itemWorks.set(m.id, href);
  return doc;
}

// The work an item belongs to. The item's own document says which
// (links.work) for an item nothing has named yet — a deep link straight to
// an episode; a tile and a member list have both said already.
async function workOf(item) {
  if (!item) return null;
  try {
    let href = itemWorks.get(item.id);
    if (!href) {
      const doc = await api(`/api/items/${item.id}`);
      href = doc.links?.work?.href;
      if (href) itemWorks.set(item.id, href);
    }
    const doc = href ? await loadWork(href) : null;
    return doc ? workFromDoc(doc) : null;
  } catch (e) {
    console.warn('work document unavailable', e);
    return null;
  }
}

// A work document that arrived some other way — GET /api/-/route answers a
// #/show/<title> hash with the whole envelope — is worth keeping: the caches
// are keyed by the document's own address, so nothing fetches it twice.
function rememberWork(doc) {
  if (doc?.self) {
    workDocs.set(doc.self, doc);
    for (const m of doc.members || []) itemWorks.set(m.id, doc.self);
  }
  return doc;
}

// A tile. `artwork` is the picture's address as the DOCUMENT gave it — the
// poster or the file's own cover, chosen by the server — and "" for a thing
// that has no picture at all, which is the text tile below without a
// round-trip to find out.
function makeCard({ artwork, title, sub, tech, onClick }) {
  const c = document.createElement('div');
  c.className = 'card';
  c.onclick = onClick;
  const wrap = document.createElement('div');
  wrap.className = 'poster-wrap';
  const textTile = () => { // no artwork: styled text tile with title/resolution
    wrap.classList.add('text-tile');
    wrap.innerHTML = `<div class="tile-title">${esc(title)}</div><div class="tile-sub">${esc(tech)}</div>`;
  };
  if (!artwork) textTile();
  else {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = '';
    img.src = artwork;
    img.onerror = () => { img.remove(); textTile(); };
    wrap.appendChild(img);
  }
  c.appendChild(wrap);
  c.insertAdjacentHTML('beforeend',
    `<div class="c-title">${esc(title)}</div>` +
    (sub ? `<div class="c-sub">${esc(sub)}</div>` : '') +
    `<div class="c-tech">${esc(tech)}</div>`);
  return c;
}

// ---------------------------------------------------------------------------
// genre chips: the library document's genre facet — the commonest genres
// over the tiles, in the order the document lists them, and nothing at all
// when no work carries one. The chip does not regroup anything: it filters
// the tiles the grid already has.
// ---------------------------------------------------------------------------
function genreFacet() { return libraryDoc?.facets?.genre || []; }
function renderGenreRow() {
  const row = $('genre-row');
  const facet = genreFacet();
  if (!facet.length) { row.hidden = true; row.innerHTML = ''; activeGenre = null; return; }
  const names = facet.map(f => f.value);
  if (activeGenre && !names.includes(activeGenre)) activeGenre = null;
  row.innerHTML = '';
  for (const g of [null, ...names]) {
    const b = document.createElement('button');
    b.textContent = g || 'All';
    if (g === activeGenre) b.className = 'active';
    b.onclick = () => { activeGenre = g; renderGenreRow(); renderGrid(); };
    row.appendChild(b);
  }
  row.hidden = false;
}

// The grid IS the library document: one card per tile, in the document's
// order, filtered by the search box and the active genre chip. No grouping,
// no sorting, no counting happens here — every one of those was a rule the
// server also had, and now only the server has.
function renderGrid() {
  const q = $('search').value.trim().toLowerCase();
  const grid = $('grid');
  grid.innerHTML = '';
  const tiles = libraryDoc?.items || [];
  if (!tiles.length) {
    grid.innerHTML = '<div id="empty">No items yet — run a scan.</div>';
    $('lib-count').textContent = '';
    return;
  }
  let count = 0;
  for (const t of tiles) {
    if (activeGenre && !(t.genres || []).includes(activeGenre)) continue;
    if (q && !String(t.search || '').includes(q)) continue;
    grid.appendChild(makeCard({
      artwork: t.links?.artwork?.href, title: t.title, sub: t.subtitle, tech: t.tech,
      onClick: () => navigate(tileHash(t)),
    }));
    count++;
  }
  $('lib-count').textContent = `${count} title${count === 1 ? '' : 's'}`;
  if (!count) grid.innerHTML = '<div id="empty">Nothing matches your search.</div>';
}
// Where a tile goes when it is tapped. The hash grammar is still the
// client's (README "Deep links and passages"), so the tile's kind picks the
// spelling: an artist's shelf, a show's episode list, or the member the tile
// opens at (`item_id` — the film itself, track one, the book).
function tileHash(t) {
  if (t.kind === 'artist') return artistHash(t.title);
  if (t.work_kind === 'show') return showHash(t.title);
  return itemHash(t.item_id, null);
}
$('search').oninput = renderGrid;

// One fetch for the grid (the library document) and one for the item fields
// the panes still read. A scan that changed the library invalidates every
// work document this page cached, so they go together.
async function loadItems() {
  forgetWorks();
  const [items, lib] = await Promise.all([api('/api/items'), api(`/api/library?client_id=${profileParam()}`)]);
  allItems = items;
  libraryDoc = lib;
  // A tile has already said which work its member belongs to; remembering it
  // saves the item fetch when that tile is opened.
  for (const t of libraryDoc.items || []) {
    if (t.item_id && t.links?.self?.href) itemWorks.set(t.item_id, t.links.self.href);
  }
  itemsLoaded = true;
  renderGenreRow();
  renderGrid();
  renderContinueWatching();
}

// ---------------------------------------------------------------------------
// continue watching: one GET /api/continue?client_id=… (server-derived, max 20,
// most-recent first, excludes finished/<5s). If that endpoint 404s (older
// server), fall back to the original mechanism: per-profile recently-played id
// list in localStorage + one GET /api/progress per touched item.
// ---------------------------------------------------------------------------
function recentKey() { return 'recent:' + (clientId || 'anonymous'); }
function recentIds() {
  try { const l = JSON.parse(localStorage.getItem(recentKey()) || '[]'); return Array.isArray(l) ? l : []; }
  catch (e) { return []; }
}
function recordRecentlyPlayed(itemId) {
  const l = recentIds().filter(id => id !== itemId);
  l.unshift(itemId);
  localStorage.setItem(recentKey(), JSON.stringify(l.slice(0, 20)));
}

let cwRenderSeq = 0;
let continueApiDead = false; // /api/continue 404'd => older server, use localStorage path

// entries: [{ id, title, label, pct }] — click navigates to the item route and
// auto-resumes (playItem picks up saved progress itself).
function renderCwCards(entries) {
  const box = $('cw'), row = $('cw-row');
  if (!entries.length) { box.hidden = true; row.innerHTML = ''; return; }
  row.innerHTML = '';
  for (const en of entries) {
    const c = document.createElement('div');
    c.className = 'cw-card';
    const wrap = document.createElement('div');
    wrap.className = 'poster-wrap';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = '';
    // The resume list is not a document yet (docs/hypermedia.md step 4), so
    // this row is the one place that still guesses at a picture: the poster,
    // then the item's own cover.
    img.src = `/api/items/${en.id}/poster`;
    img.onerror = () => {
      if (!img.dataset.cover) { img.dataset.cover = '1'; img.src = `/api/items/${en.id}/cover`; return; }
      img.remove();
      wrap.classList.add('text-tile');
      wrap.innerHTML = `<div class="tile-title">${esc(en.title)}</div>` +
        (en.label ? `<div class="tile-sub">${esc(en.label)}</div>` : '');
    };
    wrap.appendChild(img);
    c.appendChild(wrap);
    c.insertAdjacentHTML('beforeend',
      `<div class="cw-bar"><div style="width:${en.pct.toFixed(1)}%"></div></div>` +
      `<div class="c-title">${esc(en.title)}</div>` +
      (en.label ? `<div class="c-sub">${esc(en.label)}</div>` : ''));
    c.onclick = () => { pendingAutoplay = en.id; navigate(itemHash(en.id)); };
    row.appendChild(c);
  }
  box.hidden = false;
}

async function renderContinueWatching() {
  const seq = ++cwRenderSeq;
  const cid = encodeURIComponent(clientId || 'anonymous');
  // preferred: one server call, already sorted/filtered (max 20, unfinished)
  if (!continueApiDead) {
    try {
      const list = await api(`/api/continue?client_id=${cid}`);
      if (seq !== cwRenderSeq) return; // a newer render superseded this one
      renderCwCards((Array.isArray(list) ? list : []).map(e => ({
        id: e.item_id,
        title: e.title || '',
        label: e.label && e.label !== e.title ? e.label : '', // movies: label duplicates title
        pct: e.duration_seconds > 0 ? Math.min(100, e.position_seconds / e.duration_seconds * 100)
                                    : Math.min(100, (e.fraction || 0) * 100), // text: the book's own fraction
      })));
      return;
    } catch (e) {
      if (e.status !== 404) { if (seq === cwRenderSeq) renderCwCards([]); return; }
      continueApiDead = true; // older server — fall through to the localStorage path
    }
  }
  // fallback (older server): per-profile recent id list + one /api/progress each
  const byId = new Map(allItems.map(it => [it.id, it]));
  const items = recentIds().map(id => byId.get(id)).filter(Boolean);
  if (!items.length) { if (seq === cwRenderSeq) renderCwCards([]); return; }
  const entries = (await Promise.all(items.map(async it => {
    try {
      const { position_seconds } = await api(`/api/progress?item_id=${it.id}&client_id=${cid}`);
      const dur = it.media_info?.duration_seconds;
      if (position_seconds > 5 && (!dur || position_seconds < dur * 0.9)) {
        return { id: it.id, title: itemTitle(it), label: '',
                 pct: dur ? Math.min(100, position_seconds / dur * 100) : 0 };
      }
    } catch (e) { /* no progress saved */ }
    return null;
  }))).filter(Boolean);
  if (seq !== cwRenderSeq) return; // a newer render superseded this one
  renderCwCards(entries);
}

// ---------------------------------------------------------------------------
// navigation — location.hash is the single source of truth:
//   #/                 library grid
//   #/show/<title>     episode list (title encodeURIComponent'd)
//   #/artist/<name>    an artist's albums, year order (name encodeURIComponent'd; web/audio.js)
//   #/item/<id>        detail pane (back target: its show for episodes, else grid)
//   #/item/<id>?t=<s>&end=<s>[&until=<item_id>]
//                      a PASSAGE of that item (grammar in internal/passage): plays on
//                      arrival from t, stops at end, writes no progress
//   #/item/<id>?from=<loc>&to=<loc>
//                      a text passage: the reader opens at from, stops at to,
//                      writes no progress (loc = cfi:…, ch:<n>, pct:<0..1>)
//   #/show/<title>?ep=S02E05&t=<s>&end=<s>[&until=S02E07]
//                      the same passage addressed by episode code, for a minter
//                      that knows no item ids; resolved against the show's
//                      episodes by the SERVER and REPLACED by the item form above
// Every navigation action just sets the hash; the hashchange listener renders.
// The hash is not parsed here: applyRoute asks GET /api/-/route what it means
// and renders the answer (docs/hypermedia.md; the grammar is internal/passage).
// ---------------------------------------------------------------------------
let pendingAutoplay = null; // item id to auto-resume once its route renders
let routeSeq = 0;
let currentRoute = null;    // the route document the current hash resolved to
let libraryNote = null;     // one sentence for the library view (a refused route)

function showHash(name) { return '#/show/' + encodeURIComponent(name); }
// itemHash(id) keeps whatever passage the CURRENT route carries for that same
// item — re-routing the item that is playing must not strip its passage.
// Pass null to build the bare route, or a passage to route into one.
function itemHash(id, p) {
  if (p === undefined) {
    p = currentRoute?.view === 'item' && currentRoute.document?.id === id ? currentRoute.passage : null;
  }
  return '#/item/' + id + passageQuery(p);
}
function navigate(hash) {
  if (location.hash === hash) applyRoute(); // same hash: no hashchange event fires
  else location.hash = hash;
}
// The hash is resolved by the SERVER (docs/hypermedia.md, "Routes are resolved
// by the server"): the grammar lives in internal/passage and this client
// parses nothing past handing the whole hash over. The answer says which view
// to render, the document to render it from, the passage with every episode
// code and locator already resolved to ids and sections, and whether arriving
// starts it. A refusal comes back as problem+json.
async function fetchRoute(hash) {
  try {
    const res = await fetch('/api/-/route?hash=' + encodeURIComponent(hash) +
                            '&client_id=' + encodeURIComponent(clientId || 'anonymous'));
    const body = await res.json().catch(() => null);
    if (res.ok && body) return body;
    return { view: 'library', document: null, passage: null,
             problem: body || { detail: 'That link could not be opened.' } };
  } catch (e) {
    return { view: 'library', document: null, passage: null,
             problem: { detail: 'That link could not be opened: ' + (e.message || e) } };
  }
}
// Does the CURRENT hash already name this item? A show-addressed passage
// (#/show/<title>?ep=S02E05) resolves to an item and the route is then
// REPLACED by the item link — the show link was the minter's spelling, the
// item link is ours.
function hashNamesItem(id) {
  const h = location.hash || '';
  return h === '#/item/' + id || h.startsWith('#/item/' + id + '?');
}
async function applyRoute() {
  const seq = ++routeSeq;
  if (!itemsLoaded) showView('view-loading'); // deep link: brief loading state
  const [r] = await Promise.all([fetchRoute(location.hash || '#/'), itemsReady]);
  if (seq !== routeSeq) return; // superseded by a newer navigation
  currentRoute = r;
  const routedItem = r.view === 'item' ? r.document.id : null;
  // The item document the answer carries already names the work it belongs
  // to, so the detail pane below does not have to ask for it again.
  if (routedItem != null && r.document.links?.work?.href) {
    itemWorks.set(routedItem, r.document.links.work.href);
  }
  // leaving the item that's playing (browser back/forward included): stop it
  if (currentItem && routedItem !== currentItem.id) closePlayer();
  if (r.problem) {
    // A refusal is an answer: its sentence goes on the library view, which is
    // where its remedy points.
    libraryNote = r.problem.detail || r.problem.title || '';
    pendingAutoplay = null;
    pendingPlay = null;
    if ((location.hash || '#/') !== '#/') { location.replace('#/'); return; }
  }
  if (r.view === 'work') {
    // The answer's `document` IS the work envelope (hyper 1) — the show pane
    // draws straight from it, and the panes below it inherit the same
    // document rather than fetching it again.
    renderShow(rememberWork(r.document));
  } else if (r.view === 'artist') {
    if (!await renderArtist(r.document.title)) { pendingAutoplay = null; pendingPlay = null; location.replace('#/'); return; }
    if (seq !== routeSeq) return;
  } else if (r.view === 'item') {
    const it = allItems.find(i => i.id === routedItem);
    if (!it) { pendingAutoplay = null; pendingPlay = null; location.replace('#/'); return; }
    if (!hashNamesItem(it.id)) {
      // the show form resolved to this item: hand over to the item route so
      // one code path plays every passage
      pendingAutoplay = null; pendingPlay = null;
      location.replace(itemHash(it.id, r.passage || null));
      return;
    }
    if (isText(it)) {
      // A book: the reader takes the route (openReader). A from/to passage
      // opens it on arrival; "Keep reading" re-routes the open book bare.
      const tp = isTextPassage(r.passage) ? r.passage : null;
      if (Reader.isOpen(it.id) && passageQuery(Reader.passage()) === passageQuery(tp)) showView('view-detail');
      else {
        await renderDetail(it);
        if (seq !== routeSeq) return; // superseded while the work document loaded
        if (tp || pendingAutoplay === it.id) openReader(it, tp);
      }
      pendingAutoplay = null; pendingPlay = null;
      return;
    }
    // from/to (text locators) belong to the reader; only a timed passage
    // puts the video player into passage mode
    const rp = isTimedPassage(r.passage) ? r.passage : null;
    const samePlaying = currentItem && currentItem.id === it.id && !$('player-pane').hidden;
    if (samePlaying && passageQuery(rp) === passageQuery(passage)) {
      showView('view-detail'); // already playing this item: keep the player as-is
    } else if (rp) {
      // A passage route plays on arrival, from its own start — `t` wins over
      // saved progress, so never null here. Later items of an episode run
      // arrive the same way via the up-next / prev-next route replace, with
      // t/end already dropped (passageForNext), so they start at the top.
      setPassage(rp);
      if (!samePlaying) await renderDetail(it);
      if (seq !== routeSeq) return;
      playItem(it, rp.t ?? 0);
    } else if (samePlaying) {
      showView('view-detail'); // "Keep watching" dropped the passage from the route: nothing to restart
    } else {
      await renderDetail(it);
      if (seq !== routeSeq) return;
      if (pendingAutoplay === it.id) playItem(it, null);
      else if (pendingPlay && pendingPlay.id === it.id) {
        // prev/next click ('nav'): restart unless mid-episode progress exists;
        // auto-advance ('zero'): always from the top.
        if (pendingPlay.mode === 'zero') playItem(it, 0);
        else playEpisodeFromNav(it);
      }
    }
  } else {
    $('lib-note').textContent = libraryNote || '';
    $('lib-note').hidden = !libraryNote;
    libraryNote = null;
    showView('view-library');
  }
  pendingAutoplay = null;
  pendingPlay = null;
}
window.addEventListener('hashchange', applyRoute);

function showView(id) {
  for (const v of ['view-loading', 'view-library', 'view-show', 'view-artist', 'view-detail']) $(v).hidden = v !== id;
  if (id === 'view-library') renderContinueWatching(); // refresh resume points
}

// The episodes a show is watched through, and the bonus material that hangs
// off it: the work document's members, in the work document's order, bonus
// material aside. Both lists were grouped and sorted in this file until now.
function showEpisodes(doc) {
  return (doc.members || []).map(m => itemById(m.id)).filter(it => it && !isExtra(it));
}
function showExtras(doc) {
  return (doc.members || []).map(m => itemById(m.id)).filter(it => it && isExtra(it));
}

// The show pane, drawn from one work document (GET /api/works/{key}).
function renderShow(doc, note) {
  currentWork = workFromDoc(doc);
  currentShow = currentWork.title;
  const eps = showEpisodes(doc);
  $('show-title').textContent = currentWork.title;
  $('show-note').textContent = note || '';
  $('show-note').hidden = !note;
  const list = $('episode-list');
  list.innerHTML = '';
  list.hidden = !eps.length;
  for (const ep of eps) {
    const div = document.createElement('div');
    div.className = 'item';
    const en = ep.enrichment || {};
    const enriched = !!(en.episode_title || en.episode_overview || en.has_still);
    if (enriched) {
      // polished row: still thumbnail + "S2E5 · Episode Title" + clamped overview
      div.classList.add('enriched');
      if (en.has_still) {
        const img = document.createElement('img');
        img.className = 'still';
        img.loading = 'lazy';
        img.alt = '';
        img.src = `/api/items/${ep.id}/still`;
        img.onerror = () => img.remove();
        div.appendChild(img);
      }
      const body = document.createElement('div');
      body.innerHTML = `<div class="title">${esc(epLabel(ep))}` +
        (en.episode_title ? ` · ${esc(en.episode_title)}` : '') +
        `</div><div class="meta">${esc(techLine(ep))}</div>` +
        (en.episode_overview ? `<div class="overview">${esc(en.episode_overview)}</div>` : '');
      div.appendChild(body);
    } else {
      // today's plain row
      div.innerHTML = `<div class="title">${esc(epLabel(ep))}` +
        (en.title && en.title !== currentWork.title ? ` · ${esc(en.title)}` : '') +
        `</div><div class="meta">${esc(techLine(ep))}</div>`;
    }
    div.onclick = () => navigate(itemHash(ep.id));
    list.appendChild(div);
  }

  // Bonus material lives here, below the episodes — off the main grid, but
  // still one click from the show it belongs to.
  const bonus = showExtras(doc);
  const extras = $('extras-list');
  extras.innerHTML = '';
  $('extras-head').hidden = extras.hidden = !bonus.length;
  for (const ex of bonus) {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<div class="title">${esc(extraLabel(ex))}</div>` +
      `<div class="meta">${esc(techLine(ex))}</div>`;
    div.onclick = () => navigate(itemHash(ex.id));
    extras.appendChild(div);
  }
  showView('view-show');
}

// Season 0 (specials) arrives as undefined — the server omits zero values.
function seasonOf(it) { return it?.identity?.season || 0; }
// An episode nobody numbered (disc rip, title-named file) is labelled by its
// filename — "S06E00" would be a number we invented.
function epLabel(ep) {
  return ep.identity?.episode > 0
    ? `S${seasonOf(ep)}E${ep.identity.episode}` : baseName(ep.object_key);
}
// Bonus material: the filename, prefixed with the episode it accompanies when
// the path said which one.
function extraLabel(ex) {
  const name = baseName(ex.object_key);
  return ex.identity?.episode > 0
    ? `S${seasonOf(ex)}E${ex.identity.episode} · ${name}` : name;
}
$('show-back').onclick = () => navigate('#/');

// ---------------------------------------------------------------------------
// detail + playback pane (Task C)
// ---------------------------------------------------------------------------
// The detail pane. The work this item belongs to is the server's answer
// (GET /api/items/{id} → links.work → GET /api/works/{key}), and everything
// this pane says ABOUT the work — the back target, the picture, the members
// beside it, a film's bonus material — comes off that document.
async function renderDetail(item) {
  detailItem = item;
  currentWork = await workOf(item);
  if (detailItem !== item) return; // a newer render superseded this one
  const work = currentWork;
  // back target: the show view for anything that belongs to a show (bonus
  // material included), else the grid
  currentShow = work?.kind === 'show' ? work.title : null;
  const poster = $('detail-poster');
  poster.onerror = () => { poster.hidden = true; };
  poster.hidden = !work?.artwork;
  if (work?.artwork) poster.src = work.artwork;
  const isEp = item.identity?.kind === 'episode';
  $('detail-title').textContent = isEp
    ? `${displayTitle(item)} — ${epLabel(item)}`
    : isExtra(item) ? `${displayTitle(item)} — ${baseName(item.object_key)}`
    : displayTitle(item);
  const year = item.enrichment?.year || item.identity?.year;
  $('detail-year').textContent = year && !isEp && !isExtra(item) ? `(${year})` : '';
  $('detail-overview').textContent = item.enrichment?.overview || '';
  $('detail-overview').hidden = !item.enrichment?.overview;
  const mi = item.media_info;
  $('detail-tech').textContent = [
    mi?.container, fmtRes(mi), fmtSize(item.size),
    mi?.page_count ? mi.page_count + ' pages' : null,
    mi?.duration_seconds ? fmtTime(mi.duration_seconds) : null,
    mi?.bitrate_bps ? (mi.bitrate_bps / 1e6).toFixed(1) + ' Mbps' : null,
    mi?.audio_channels ? mi.audio_channels + 'ch' : null,

  }

  const nav = $('detail-epnav');
  nav.innerHTML = '';
  const sib = episodeSiblings(item);
  for (const [ep, label] of [[sib?.prev, 'Previous'], [sib?.next, 'Next']]) {
    if (!ep) continue; // first/last episode: omit that side
    const a = document.createElement('a');
    a.href = itemHash(ep.id, passageForNext(passage)); // a run carries `until`; t/end were this item's
    const name = ep.enrichment?.episode_title;

  if (mExtras.length) exBox.innerHTML = '<span class="label">Extras</span>';

$('detail-play').onclick = () => playItem(detailItem, null);

// leave the player: stop playback and reveal detail info again (also invoked
// by applyRoute when browser back/forward navigates away from a playing item)
function closePlayer() {
  hideUpNext();
  Reader.close(); // a book shares this exit (no-op when none is open)
  setPassage(null); // the next normal play is normal
  if (casting()) { castEndSuppressed = true; remoteController.stop(); }
  else { video.pause(); video.removeAttribute('src'); video.load(); }
  stopSession(); // the session document goes with it, marks and all
  renderMarks();
  currentItem = null;
  audioMode(null);
  $('tap-to-play').hidden = true;
  $('player-pane').hidden = true;
  $('detail-info').hidden = false;
  renderContinueWatching(); // playback session ended: refresh resume points
  if (swReloadPending) location.reload(); // the deploy that landed mid-stream, taken now
}

$('detail-back').onclick = () => {
  if (!$('player-pane').hidden) closePlayer(); // no route change: still on the item
  else navigate(currentShow ? showHash(currentShow) : audioBackHash(detailItem) || '#/'); // a track: its artist's shelf
};

// Play with resume: fetch saved progress (keyed by profile name) unless an
// explicit start time (e.g. a chapter) was requested.
async function playItem(item, startAt) {
  if (isText(item)) { openReader(item, null); return; } // a book is read, not played
  hideUpNext();
  currentItem = item;
  seekOffset = 0;
  renderMarks(); // repainted from the new session once the play answers
  $('detail-info').hidden = true;
  $('player-pane').hidden = false;
  $('now-playing').textContent = itemTitle(item);
  updateEpisodeNav(item);
  audioMode(item); // an audio item: cover in place of the picture, parts list beside it
  resetPassageEnd();
  let resume = startAt;
  // A passage starts where it says (or at the top): its route never resumes
  // from /api/progress.
  if (resume == null && passage) resume = 0;
  if (resume == null) {
    resume = 0;
    try {
      const { position_seconds } = await api(
        `/api/progress?item_id=${item.id}&client_id=${encodeURIComponent(clientId || 'anonymous')}`);
      const dur = item.media_info?.duration_seconds ?? Infinity;
      if (position_seconds > 5 && position_seconds < dur - 10) resume = position_seconds;
    } catch (e) { /* no saved progress */ }
  }
  renderSubSelector(item);
  renderAudioSelector(item);
  if (!passage) recordRecentlyPlayed(item.id); // feeds the continue-watching row; a passage is not a place
  loadTrickplay(item); // lazy, in the background; feature hides itself on 404
  await startPlayback(item, resume);
  renderChapters();
  $('t-total').textContent = fmtTime(duration());
}

// ---------------------------------------------------------------------------
// episode navigation (prev/next) + auto-advance on natural end
// ---------------------------------------------------------------------------
// The neighbours prev/next and up-next move to: the work's own members in
// the work's own order, bonus material aside. One rule for every kind now —
// the show's episodes, an audiobook's parts, an album's tracks — because the
// order is the server's and the server orders them all the same way.
function episodeSiblings(item) {
  const seq = (currentWork?.items || []).filter(m => !isExtra(m));
  const i = item ? seq.findIndex(m => m.id === item.id) : -1;
  if (i < 0) return null;
  return { prev: seq[i - 1] || null, next: seq[i + 1] || null };
}
function epCode(it) {
  if (!(it.identity?.episode > 0)) return baseName(it.object_key); // unnumbered
  return `S${String(seasonOf(it)).padStart(2, '0')}E${String(it.identity.episode).padStart(2, '0')}`;
}
function updateEpisodeNav(item) {
  const sib = episodeSiblings(item);
  const bp = $('btn-prev-ep'), bn = $('btn-next-ep');
  bp.hidden = !sib?.prev;
  bn.hidden = !sib?.next;
  if (sib?.prev) bp.title = `Previous episode · ${epCode(sib.prev)}`;
  if (sib?.next) bn.title = `Next episode · ${epCode(sib.next)}`;
}

// Navigate to a sibling episode. mode 'nav' (prev/next buttons) restarts from
// 0 unless the episode has meaningful progress (>5s, <90%) — then it resumes;
// mode 'zero' (auto-advance) always starts from the top. The route is
// REPLACED, not pushed: binging a season must not build a mile of history.
function goToEpisode(target, mode) {
  if (!target) return;
  hideUpNext();
  // different file: subtitle/audio/burn selections reset to defaults
  selectedSubOrdinal = null; burnSubOrdinal = null; selectedAudioOrdinal = null;
  pendingPlay = { id: target.id, mode };
  // in a run the route carries `until` on; t/end applied to the first item only
  const h = itemHash(target.id, passageForNext(passage));
  if (location.hash === h) applyRoute();
  else location.replace(h);
}
$('btn-prev-ep').onclick = () => goToEpisode(episodeSiblings(currentItem)?.prev, 'nav');
$('btn-next-ep').onclick = () => goToEpisode(episodeSiblings(currentItem)?.next, 'nav');

// Explicit navigation play: restart at 0 unless meaningful progress exists.
async function playEpisodeFromNav(it) {
  let startAt = 0;
  try {
    const { position_seconds } = await api(
      `/api/progress?item_id=${it.id}&client_id=${encodeURIComponent(clientId || 'anonymous')}`);
    const dur = it.media_info?.duration_seconds || 0;
    if (position_seconds > 5 && (!dur || position_seconds < dur * 0.9)) startAt = position_seconds;
  } catch (e) { /* no saved progress */ }
  playItem(it, startAt);
}

// The next member of the work, as the session document names it — the
// server's own order, not a list this page regrouped. The link is resolved
// through itemById, which still holds the fields the panes read.
function sessionNext() {
  const m = /\/api\/items\/(\d+)$/.exec(session?.links?.next?.href || '');
  return m ? itemById(Number(m[1])) : null;
}

}

  upNextTimer = setInterval(() => {

$('upnext-play').onclick = e => { e.stopPropagation(); playUpNextNow(); };

// Autoplay-next toggle: global (not per-profile), persisted, default ON.
// Flipping it mid-countdown takes effect immediately — the on-screen overlay
// re-renders in the new mode (OFF cancels the countdown but keeps the overlay).
let autoplayNext = localStorage.autoplayNext !== 'off';
function setAutoplay(on) {
  autoplayNext = on;

  const b = $('btn-autoplay');
  b.textContent = 'Autoplay: ' + (on ? 'on' : 'off');

$('btn-autoplay').onclick = () => setAutoplay(!autoplayNext);
setAutoplay(autoplayNext); // paint the initial label

// A natural end of playback (local 'ended', or cast IDLE/FINISHED). Episodes
// with a next sibling: record the finish (position=duration → the server
// counts it watched and /api/continue advances) and offer auto-advance.
// Movies and finales: nothing — playback just ends as before.
function onPlaybackEnded() {
  if (!currentItem || endFired) return;
  endFired = true;
  const next = episodeSiblings(currentItem)?.next;
  if (passage) {
    // Inside a passage the item's own end is not a finish to record. In a
    // run it is the cue for the next episode — until the `until` item (or
    // the last episode there is) has played; then the passage is over. WHICH
    // episode is next is the session document's answer (links.next): the
    // work's own order is the server's, not the grid's.
    const runNext = sessionNext() || next;
    if (runContinues(passage, currentItem.id) && runNext) { showUpNext(runNext); return; }
    passageNaturalEnd = true;
    onPassageEnd(`${itemTitle(currentItem)} has ended`);
    return;
  }
  if (!next) return;
  const dur = currentItem.media_info?.duration_seconds;
  if (dur > 0) saveProgress(dur);

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flickr</title>
<meta name="theme-color" content="#14151a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/audio.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<style>
  /* the colour tokens. --warn is amber: it belongs to passages (the bound
     flags, the mark chips, the end-of-passage panel) and to a refusal.
     Progress and status text is --muted or --accent, never a warning. */
  :root { color-scheme: dark;
    --fg: #e8e8ea; --muted: #9a9daa; --accent: #8db4f0; --warn: #f0b45c; --ok: #6ee7a0; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #14151a; color: var(--fg); }
  header { padding: 12px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #2a2c33; }
  header h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 600; }
  /* the search box lives in the header now, and is only up on the library */
  #search { width: 260px; max-width: 40vw; }
  #gear { font-size: 15px; line-height: 1; padding: 6px 10px; }
  button, select, input[type=text] { background: #23252d; color: inherit; border: 1px solid #3a3d47; border-radius: 6px; padding: 6px 12px; font-size: 13px; }
  button, select { cursor: pointer; }
  button:hover { background: #2c2f38; }
  main { padding: 0; }
  .back { font-size: 13px; margin: 14px 0 0 20px; }

  /* profile gate */
  #gate { position: fixed; inset: 0; background: rgba(10,11,14,0.92); z-index: 100; display: flex; align-items: center; justify-content: center; }
  #gate-box { background: #1b1d24; border: 1px solid #2a2c33; border-radius: 12px; padding: 28px 32px; max-width: 420px; width: 92%; text-align: center; }
  #gate-box h2 { margin: 0 0 18px; font-size: 18px; font-weight: 600; }
  #gate-profiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
  #gate-profiles button { font-size: 15px; padding: 10px 18px; border-radius: 8px; }
  #gate-new { display: flex; gap: 8px; justify-content: center; }
  #gate-new input { flex: 1; }
  #gate-note { font-size: 11px; color: var(--muted); margin-top: 12px; }
  #profile-chip { background: #1e2c42; color: var(--accent); border-color: #2a3d5c; border-radius: 12px; }

  /* the settings panel, behind the gear: the same box as the profile gate.
     Everything in it is an engineering control, which is why it is not on
     every screen any more. */
  #settings { position: fixed; inset: 0; background: rgba(10,11,14,0.92); z-index: 100; display: flex; align-items: center; justify-content: center; }
  #settings-box { background: #1b1d24; border: 1px solid #2a2c33; border-radius: 12px; padding: 24px 28px; max-width: 460px; width: 92%; }
  #settings-box h2 { margin: 0 0 18px; font-size: 18px; font-weight: 600; }
  .set-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .set-row > label { font-size: 12px; color: var(--muted); }
  .set-row.end { justify-content: flex-end; margin-bottom: 0; }
  #scan-status { font-size: 12px; color: var(--muted); }
  #hw { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #1e2c42; color: var(--accent); cursor: help; }

  /* library grid */
  #lib-bar { display: flex; gap: 10px; align-items: center; padding: 16px 20px 0; }
  #lib-count { font-size: 12px; color: var(--muted); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; padding: 16px 20px 30px; }
  .card { cursor: pointer; }
  .card:hover .poster-wrap { outline: 2px solid #5b8def; }
  .poster-wrap { aspect-ratio: 2/3; width: 100%; border-radius: 8px; background: #1e2026; overflow: hidden; position: relative; }
  .poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster-wrap.text-tile { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; padding: 12px; text-align: center; background: linear-gradient(160deg, #232633, #191b22); }
  .text-tile .tile-title { font-size: 14px; font-weight: 600; color: #c5c8d4; word-break: break-word; }
  .text-tile .tile-sub { font-size: 11px; color: var(--muted); }
  .card .c-title { font-size: 13px; margin-top: 8px; font-weight: 600; line-height: 1.3; }
  .card .c-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #empty { padding: 40px; color: var(--muted); font-size: 14px; }
  #view-loading { padding: 40px; color: var(--muted); font-size: 14px; }

  /* genre chip row */
  #genre-row { display: flex; gap: 8px; padding: 12px 20px 0; overflow-x: auto; scrollbar-width: thin; }
  #genre-row button { white-space: nowrap; border-radius: 14px; font-size: 12px; padding: 5px 14px; }
  #genre-row button.active { background: #2a4a8a; border-color: #3a5da8; color: #dbe6fa; }

  /* continue-watching row */
  #cw { padding: 14px 20px 0; }
  #cw h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  #cw-row { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 6px; }
  .cw-card { flex: 0 0 130px; cursor: pointer; }
  .cw-card:hover .poster-wrap { outline: 2px solid #5b8def; }
  .cw-card .poster-wrap { aspect-ratio: 2/3; border-radius: 8px; }
  .cw-card .cw-bar { height: 3px; background: #2a2c33; border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .cw-card .cw-bar > div { height: 100%; background: #5b8def; }
  .cw-card .c-title { font-size: 12px; margin-top: 5px; font-weight: 600; line-height: 1.3; }
  .cw-card .c-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .cw-card .cw-act { font-size: 11px; color: var(--accent); margin-top: 3px; }

  /* enriched episode rows */
  .item.enriched { display: flex; gap: 12px; align-items: flex-start; }
  .item.enriched img.still { width: 128px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; background: #1e2026; flex: 0 0 auto; }
  .item.enriched .overview { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* show (episode list) view */
  #show-title { margin: 14px 20px 6px; font-size: 18px; }
  #show-note, #lib-note { margin: 0 20px 8px; font-size: 13px; }
  /* where you are in the show reads as a resume hint, like the record
     pane's own line; only the route's refusal is a warning */
  #show-note { color: var(--accent); }
  #lib-note { color: var(--warn); }
  #episode-list, #extras-list { margin: 8px 20px 30px; border: 1px solid #2a2c33; border-radius: 8px; overflow: hidden; }
  #extras-head { margin: 18px 20px 0; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .item { padding: 10px 16px; border-bottom: 1px solid #1e2026; cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #1e222c; }
  .item .title { font-size: 14px; }
  .item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* detail + player */
  #view, #stage { padding: 0 20px 30px; }
  #detail-info { display: flex; gap: 22px; margin-top: 16px; flex-wrap: wrap; }
  #detail-poster { width: 180px; aspect-ratio: 2/3; border-radius: 8px; object-fit: cover; background: #1e2026; }
  #detail-body { flex: 1; min-width: 260px; }
  #detail-body h2 { margin: 0 0 4px; font-size: 22px; }
  #detail-year { color: var(--muted); font-weight: 400; }
  #detail-overview { font-size: 14px; color: #c5c8d4; line-height: 1.5; max-width: 700px; margin: 10px 0; }
  #detail-play { font-size: 15px; padding: 9px 26px; background: #2a4a8a; border-color: #3a5da8; }
  #detail-play:hover { background: #33579e; }
  #detail-chapters { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  #detail-chapters button { font-size: 12px; padding: 4px 10px; }
  #detail-epnav { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  #detail-epnav a { background: #23252d; color: #c5c8d4; border: 1px solid #3a3d47;
    border-radius: 6px; padding: 6px 12px; font-size: 13px; text-decoration: none; }
  #detail-epnav a:hover { background: #2c2f38; }
  #detail-extras { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #detail-extras .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  #detail-extras a { background: #23252d; color: #c5c8d4; border: 1px solid #3a3d47;
    border-radius: 6px; padding: 6px 12px; font-size: 13px; text-decoration: none; }
  #detail-extras a:hover { background: #2c2f38; }
  /* the item page's Details disclosure: what the FILE is, folded away */
  #detail-details { margin: 26px 0 0; border-top: 1px solid #2a2c33; padding-top: 12px; max-width: 700px; }
  #detail-details summary { font-size: 11px; color: var(--muted); cursor: pointer; text-transform: uppercase; letter-spacing: .06em; }
  #detail-details dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 12px 0 0; font-size: 12px; }
  #detail-details dt { color: #6f7280; }
  #detail-details dd { margin: 0; color: #c5c8d4; font-family: ui-monospace, monospace; word-break: break-word; }
  #now-playing { font-size: 15px; font-weight: 600; margin: 14px 0 10px; }

  #player-chrome { margin-top: 6px; }
  /* reader pane (reader.js): a paper page in the dark UI, TOC alongside */
  #reader-pane { margin-top: 6px; display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 420px; }
  .rd-bar, .rd-nav { display: flex; gap: 10px; align-items: center; }
  .rd-bar { margin: 0 0 8px; }
  .rd-title { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-readout { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rd-body { position: relative; flex: 1; min-height: 0; display: flex; }
  .rd-view { flex: 1; min-width: 0; background: #f4f1ea; border-radius: 8px; overflow: hidden; }
  .rd-fail { padding: 24px; color: #7a1f1f; font-size: 14px; }
  .rd-toc { width: 260px; max-width: 45vw; margin-right: 10px; overflow-y: auto; border: 1px solid #2a2c33; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .rd-toc button { text-align: left; font-size: 13px; padding: 6px 10px; border: 0; background: transparent; border-radius: 6px; }
  .rd-toc button:hover { background: #2c2f38; }
  .rd-toc button.current { background: #2a4a8a; color: #dbe6fa; }
  .rd-toc-empty { font-size: 12px; color: var(--muted); padding: 8px; }
  .rd-nav { margin-top: 8px; justify-content: space-between; }
  .rd-nav button:disabled { opacity: .45; cursor: default; }
  .rd-msg { font-size: 13px; color: var(--muted); flex: 1; text-align: center; }
  .rd-end { position: fixed; right: 24px; bottom: 24px; z-index: 60; background: #1b1d24; border: 1px solid var(--warn);
    border-radius: 10px; padding: 14px 18px; max-width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
  .rd-end-title { font-size: 14px; font-weight: 600; }
  .rd-end-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  /* the PDF pane (pdfreader.js): one page on a canvas, fit to the width, scrolled when taller */
  .rd-pdf { overflow: auto; background: #3a3b40; padding: 6px; }
  .rd-canvas { display: block; margin: 0 auto; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.5); }
  /* the dark page (ReaderTheme in reader.js): the epub frame is themed from
     inside by epub.js; the PDF canvas is inverted here, hue-rotated so a
     colour figure keeps its hues while the paper goes dark */
  .rd-dark .rd-view { background: #1b1d24; }
  .rd-dark .rd-canvas { background: #1b1d24; filter: invert(.91) hue-rotate(180deg); }
  /* the book's own choice (session.display): as printed keeps a PDF's page white
     under the dark chrome — a scan inverted would be a negative */
  .rd-dark.rd-printed .rd-canvas { background: #fff; filter: none; }
  .rd-theme, .rd-pictures { font-size: 16px; line-height: 1; }
  .rd-page { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rd-page-in { width: 64px; font-size: 13px; padding: 4px 6px; border-radius: 6px; border: 1px solid #2a2c33; background: #14151a; color: inherit; }
  .rd-end button { margin-top: 10px; margin-right: 8px; }
  .rd-keep { background: #2a4a8a; border-color: #3a5da8; }
  .rd-keep:hover { background: #33579e; }
  video { width: 100%; max-height: 58vh; background: #000; border-radius: 8px; }
  body.casting video { opacity: 0.25; }
  #cast-overlay { display: none; font-size: 14px; color: var(--accent); margin: 6px 0; }
  body.casting #cast-overlay { display: block; }
  #scrub { position: relative; height: 22px; margin: 10px 0 2px; cursor: pointer; }
  #scrub .rail { position: absolute; left: 0; right: 0; top: 8px; height: 6px; background: #2a2c33; border-radius: 3px; }
  #scrub .avail { position: absolute; left: 0; top: 8px; height: 6px; background: #3d4250; border-radius: 3px; width: 0; }
  #scrub .fill { position: absolute; left: 0; top: 8px; height: 6px; background: #5b8def; border-radius: 3px; width: 0; }
  #scrub .tick { position: absolute; top: 6px; width: 2px; height: 10px; background: #8a92a8; border-radius: 1px; }
  /* passage bounds: amber flags pointing into the passage — taller and
     coloured so they cannot be mistaken for chapter ticks */
  #scrub .bound { position: absolute; top: 2px; width: 3px; height: 18px; background: var(--warn); border-radius: 2px; transform: translateX(-50%); z-index: 2; }
  #scrub .bound::after { content: ''; position: absolute; top: 0; width: 6px; height: 5px; background: var(--warn); }
  #scrub .bound.start::after { left: 3px; border-radius: 0 3px 3px 0; }
  #scrub .bound.end::after { right: 3px; border-radius: 3px 0 0 3px; }
  #thumb { position: absolute; bottom: 26px; transform: translateX(-50%); z-index: 5; pointer-events: none; text-align: center; }
  #thumb-img { background-color: #000; background-repeat: no-repeat; border: 1px solid #3a3d47; border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
  #thumb-time { display: inline-block; margin-top: 3px; font-size: 11px; padding: 1px 7px; border-radius: 8px; background: rgba(20,21,26,0.9); color: #c5c8d4; font-variant-numeric: tabular-nums; }
  #timebar { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #controls { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  #controls button { min-width: 42px; }
  #controls input[type=range] { width: 110px; accent-color: #5b8def; }
  /* making a passage: the in/out chips turn amber like the .bound flags once
     set and grow a small × that clears the mark */
  #controls .markchip { display: inline-flex; }
  #controls .markchip button { font-variant-numeric: tabular-nums; }
  #controls .markchip .mark-clear { min-width: 0; padding: 6px 8px; border-left: 0; border-radius: 0 6px 6px 0; color: var(--muted); }
  #controls .markchip .mark-clear:hover { color: #f08080; }
  #controls .markchip.set button { border-color: #a37a30; color: var(--warn); }
  #controls .markchip.set button:first-child { border-radius: 6px 0 0 6px; background: #2e2616; }
  #controls .markchip.set button:first-child:hover { background: #3a3019; }
  /* the minted link, as text too (a phone with no clipboard API long-presses it) */
  #passage-link { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  #passage-link .copied { color: var(--ok); }
  #passage-link code { user-select: all; -webkit-user-select: all; word-break: break-all; color: #c5c8d4;
    background: #1b1d24; border: 1px solid #3a3d47; border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  google-cast-launcher { width: 28px; height: 28px; cursor: pointer; --connected-color: #5b8def; --disconnected-color: var(--muted); }
  #chapters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #chapters button { font-size: 12px; padding: 4px 10px; }
  #status { font-size: 13px; color: var(--muted); margin: 10px 0; }
  /* up-next auto-advance overlay */
  #upnext { position: fixed; right: 24px; bottom: 24px; z-index: 60; background: #1b1d24; border: 1px solid #3a3d47;
    border-radius: 10px; padding: 14px 18px; max-width: 340px; cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
  #upnext:hover { border-color: #5b8def; }
  #upnext-title { font-size: 14px; font-weight: 600; }
  #upnext-count { font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  #upnext-cancel { margin-top: 10px; }
  #upnext-play { margin-top: 10px; margin-right: 8px; background: #2a4a8a; border-color: #3a5da8; }
  #upnext-play:hover { background: #33579e; }
  /* end-of-passage panel: paused at the bound, two ways out */
  #device { position: relative; }
  #tap-to-play { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); z-index: 55;
    font-size: 20px; padding: 14px 26px; border-radius: 999px; background: #2a4a8a; border: 1px solid #3a5da8; color: #fff; cursor: pointer; }
  #tap-to-play:hover { background: #33579e; }
  #passage-end { position: fixed; right: 24px; bottom: 24px; z-index: 60; background: #1b1d24; border: 1px solid var(--warn);
    border-radius: 10px; padding: 14px 18px; max-width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
  #passage-end-title { font-size: 14px; font-weight: 600; }
  #passage-end-sub { font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  #passage-keep { margin-top: 10px; margin-right: 8px; background: #2a4a8a; border-color: #3a5da8; }
  #passage-keep:hover { background: #33579e; }
  #passage-back { margin-top: 10px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-right: 6px; }
  .badge.direct { background: #14432a; color: var(--ok); }
  .badge.transcode { background: #4a3413; color: var(--warn); }
  .badge.deny { background: #4a1a1a; color: #f08080; }
  #trace { margin-top: 14px; font-size: 13px; }
  /* the steps hide behind a disclosure: the badge line is the answer, this is
     only for whoever asks why */
  #trace summary { font-size: 13px; color: var(--muted); margin: 14px 0 6px; cursor: pointer; width: fit-content; }
  #trace summary:hover { color: #c5c8d4; }
  #trace details[open] summary { margin-bottom: 8px; }
  .step { display: flex; gap: 8px; padding: 3px 0; font-family: ui-monospace, monospace; font-size: 12px; }
  .step .mark { width: 16px; }
  .step.pass .mark { color: var(--ok); }
  .step.fail .mark { color: #f08080; }
  .step .check { width: 130px; color: #c5c8d4; }
  .step .detail { color: var(--muted); }

  /* one #view holds whichever document is on screen; #stage holds the two
     devices (the player's chrome around the persistent media element, and the
     reader's container), and the two are never both up */
  #view > .back, #stage > .back { margin-left: 0; }
  #lib-bar, #genre-row, #cw, #grid, #show-title, #show-note, #episode-list,
  #extras-head, #extras-list, #artist-head, #artist-albums { margin-left: 0; margin-right: 0; }
  #grid { padding-left: 0; padding-right: 0; }
  #artist-head { margin-left: 0; }
  #artist-albums { padding-left: 0; padding-right: 0; }
  #lib-bar { padding-left: 0; }
  #genre-row { padding-left: 0; }
  #cw { padding-left: 0; }
  #show-title { margin-left: 0; }
  #episode-list, #extras-list { margin-left: 0; margin-right: 0; }
  #extras-head { margin-left: 0; }

  /* a control drawn from an action: the document's own label on it */
  .act { margin-right: 8px; }
  .act.primary { font-size: 15px; padding: 9px 26px; background: #2a4a8a; border-color: #3a5da8; }
  .act.primary:hover { background: #33579e; }
  #work-actions { margin: 10px 0 4px; }
  .unavailable { font-size: 12px; color: var(--muted); margin: 10px 0; }
  /* the document's own controls, under the device's transport row */
  #doc-controls { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  #doc-controls button { min-width: 42px; }
  #doc-controls .markchip { display: inline-flex; }
  #doc-controls .markchip button { font-variant-numeric: tabular-nums; margin-right: 0; }
  #doc-controls .markchip .mark-clear { min-width: 0; padding: 6px 8px; border-left: 0; border-radius: 0 6px 6px 0; color: var(--muted); }
  #doc-controls .markchip .mark-clear:hover { color: #f08080; }
  #doc-controls .markchip.set button { border-color: #a37a30; color: var(--warn); }
  #doc-controls .markchip.set button:first-child { border-radius: 6px 0 0 6px; background: #2e2616; }
  #doc-controls .markchip.set button:first-child:hover { background: #3a3019; }

  /* minting a passage from a work: the two places, and the link that comes back */
  #passage-picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  #passage-picker select { max-width: 40vw; }

  /* what a refusal reads as: the server's sentence, and its remedy */
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 90;
    background: #2e2616; color: var(--warn); border: 1px solid #a37a30; border-radius: 8px;
    padding: 10px 16px; font-size: 13px; max-width: min(680px, 92vw); box-shadow: 0 8px 30px rgba(0,0,0,0.6); }

  /* --- the page on a wide screen, on a phone, and under a thumb -------------

     Three rules in the order a window meets them. The measure first: past
     1400px the header's rule still spans the glass but its content stops
     widening. Then the phone, where the two-column shapes (poster beside
     text, contents beside page) have no room to be two columns. Then the
     pointer, which is not a question of width at all: a finger needs 44px
     whatever the screen. */

  /* very wide: content keeps its measure, borders still reach the edge */
  header, #view, #stage { padding-inline: max(20px, calc((100% - 1400px) / 2)); }

  @media (max-width: 640px) {
    header, #view, #stage { padding-inline: 12px; }
    header { padding-block: 8px; gap: 8px; }
    header h1 { font-size: 14px; }
    #lib-bar { flex-wrap: wrap; padding-top: 12px; }
    #search { width: 100%; max-width: none; }
    #grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
    .card .c-title { font-size: 12px; }
    .cw-card { flex: 0 0 110px; }
    .item.enriched img.still { width: 96px; }
    /* the poster is a picture, not a column: it stacks and centres */
    #detail-info { flex-direction: column; gap: 14px; }
    #detail-poster { width: 40vw; max-width: 220px; align-self: center; }
    #detail-body { min-width: 0; }
    #detail-body h2 { font-size: 19px; }
    /* the transport wraps onto as many rows as it needs, with room to hit */
    #controls, #doc-controls { gap: 10px; }
    #controls button, #doc-controls button { min-width: 48px; padding: 8px 14px; font-size: 14px; }
    #controls input[type=range] { width: 100%; }
    #passage-picker select { max-width: 100%; }
    /* the contents list has no room beside the page, so it slides over it —
       .rd-body is the positioned parent and reader.js already toggles hidden */
    #reader-pane { height: calc(100vh - 120px); min-height: 0; }
    .rd-bar { flex-wrap: wrap; }
    .rd-toc { position: absolute; inset: 0 auto 0 0; z-index: 40; width: min(80vw, 300px);
      max-width: none; margin-right: 0; background: #1b1d24; box-shadow: 0 10px 40px rgba(0,0,0,0.7); }
    /* the corner panels have no corner to sit in */
    #upnext, #passage-end, .rd-end { left: 12px; right: 12px; max-width: none; }
  }

  @media (pointer: coarse) {
    button, select, input { min-height: 44px; }
    .item { min-height: 44px; padding-top: 13px; padding-bottom: 13px; }
    google-cast-launcher { width: 44px; height: 44px; }
  }

  /* where the keyboard is: one ring, the accent, on everything that acts.
     [tabindex] catches whatever else is made focusable later. */
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible,
  .card:focus-visible, .cw-card:focus-visible, .item:focus-visible,
  google-cast-launcher:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid #5b8def; outline-offset: 2px;
  }
</style>
</head>
<body>
<!-- the header is the name, the search box and who is watching. The search
     box filters the library and only the library, so the kernel hides it
     wherever it would filter nothing. -->
<header>
  <h1>flickr</h1>
  <input type="text" id="search" placeholder="Search titles…" hidden>
  <button id="profile-chip" title="Switch profile">…</button>
  <button id="gear" title="Settings" aria-label="Settings">⚙</button>
</header>

<!-- settings: the capability preset, the scan, what the encoder chose and the
     autoplay-next toggle. Engineering controls, one gear away rather than on
     every screen. #profile is still the id player.js reads caps() from. -->
<div id="settings" hidden>
  <div id="settings-box">
    <h2>Settings</h2>
    <div class="set-row">
      <label for="profile">Play as</label>
      <select id="profile">
        <option value="browser">This browser (detected)</option>
        <option value="chromecast1">Chromecast v1 (h264/1080p only)</option>
        <option value="chromecastUltra">Chromecast Ultra (4K, hevc/vp9, HDR)</option>
        <option value="tv4k">4K HDR TV (hevc, hdr10)</option>
        <option value="cellular">Phone on cellular (3 Mbps cap)</option>
      </select>
    </div>
    <div class="set-row">
      <button id="settings-autoplay"></button>
    </div>
    <div class="set-row">
      <button id="scan">Scan library</button>
      <span id="scan-status"></span>
    </div>
    <div class="set-row">
      <span id="hw" title=""></span>
    </div>
    <div class="set-row end">
      <button id="settings-close">Close</button>
    </div>
  </div>
</div>

<!-- profile gate: who is watching. The names are GET (root.links.profiles)
     and a new one is root.actions.create_profile; kernel.js fills the box. -->
<div id="gate" hidden>
  <div id="gate-box">
    <h2>Who's watching?</h2>
    <div id="gate-profiles"></div>
    <div id="gate-new">
      <input type="text" id="gate-name" placeholder="New profile name" maxlength="40">
      <button id="gate-create">Create</button>
    </div>
    <div id="gate-note"></div>
  </div>
</div>

<main>
  <!-- whichever document the route resolved to, drawn by web/renderers.js -->
  <div id="view"><div id="view-loading">Loading…</div></div>

  <!-- the stage: the two DEVICES, which outlive any one document. The player
       chrome is re-rendered from the session document and the persistent
       <video> is moved back into it (player.js, attach); the reader container
       is never re-rendered at all — moving an iframe would reload the book. -->
  <div id="stage" hidden>
    <div id="player-chrome" hidden></div>
    <div id="reader-pane" hidden></div>
  </div>
</main>

<!-- a refusal, said out loud -->
<div id="toast" hidden></div>

<!-- the passage grammar and the clock predicates: pure functions, shared with
     web/passage_test.mjs -->
<script src="passage.js"></script>
<!-- the cast bridge: the session document read into a load, shared with the
     custom receiver (web/receiver.html) and tested by web/cast_test.mjs -->
<script src="cast.js"></script>
<!-- the reader panes for text items: epub.js + JSZip vendored (LAN-only, no
     CDN at read time), then reader.js. pdf.js is an ES module that leaves
     `pdfjsLib` on window; pdfreader.js looks the global up only when a PDF is
     opened. reader.js is the facade over both panes. -->
<script src="vendor/jszip.min.js"></script>
<script src="vendor/epub.min.js"></script>
<script type="module" src="vendor/pdf.min.mjs"></script>
<script src="pdfreader.js"></script>
<script src="reader.js"></script>
<!-- the client proper, in dependency order: the renderers (pure functions of
     a document), the device, then the kernel that routes and mounts. -->
<script src="renderers.js"></script>
<script src="player.js"></script>
<script src="kernel.js"></script>
<script>Kernel.boot();</script>
</body>
</html>

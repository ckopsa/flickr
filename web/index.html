}
video.addEventListener('ended', onPlaybackEnded); // covers direct play AND hls.js

// The one road to a progress write, and it goes through the session:
// actions.progress is the address, and the answer to a write during a
// passage is 409 — a scene replayed for a talk is not where the person is
// in the film. That refusal is the server's answer, not an error: no retry,
// nothing said on screen. (There is no pause/unload write today; if one is
// added it goes through here.) The reader reports through here too, with
// `place` = { locator, fraction, section } instead of a clock position; it
// has no session document until hyper 5, so for it the old client-side gate
// is still the only rule there is.
function saveProgress(positionSeconds, place) {
  if (!currentItem) return;
  // The session's action, but only while it is THIS item's session — a book
  // opened over a player that is still up has none of its own.
  const act = session?.item_id === currentItem.id ? session.actions?.progress : null;
  if (!act && passage) return;
  fetch(act ? act.href : '/api/progress', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      item_id: currentItem.id, client_id: clientId || 'anonymous',
      position_seconds: positionSeconds, ...(place || {}),
    }),
  }).catch(() => { /* the network, or a refusal; neither is the player's business */ });
}

// ---------------------------------------------------------------------------
// text: the reader pane (reader.js; a .pdf goes to pdfreader.js behind the
// same Reader facade). A book is read, not played, but it keeps the
// player's contract: currentItem marks the pane open so a route change
// closes it (closePlayer → Reader.close), `passage` gates saveProgress exactly
// as for video, and the place is reported through saveProgress with a
// locator (an EPUB's CFI, or a PDF's page) instead of seconds. routePassage
// is the route's from/to (or null).
// ---------------------------------------------------------------------------
function isText(it) { return it?.media_info?.medium === 'text'; }
function openReader(item, routePassage) {
  hideUpNext();
  const tp = isTextPassage(routePassage) ? routePassage : null;
  currentItem = item;
  setPassage(tp);
  $('detail-info').hidden = true;
  $('player-pane').hidden = true;
  Reader.open(item, {
    container: $('reader-pane'),
    passage: tp,
    clientId: clientId || 'anonymous',
    onPlace: place => saveProgress(0, place), // gated: a passage writes nothing
    onKeep: () => { setPassage(null); if (currentRoute?.passage) location.replace(itemHash(item.id, null)); },
    onBack: () => { closePlayer(); if (currentRoute?.passage) location.replace(itemHash(item.id, null)); },
  });
  if (!tp) recordRecentlyPlayed(item.id); // feeds the continue row's fallback path
}

// ---------------------------------------------------------------------------
// passage sessions: start there, stop there, never move the saved place
// (grammar and predicates live in passage.js; this is the player's side)
// ---------------------------------------------------------------------------
function setPassage(p) {
  passage = p || null;

  renderPassageMarks();
}
// The bound this item is to stop at. The server worked it out (a run's
// `end` belongs to its LAST member, and the document says so per session);
// the clock-side predicate stands in for a passage the player holds without
// a session — the reader's, and a route applied before play answers.
function passageEndNow() {
  const p = session?.passage;
  return p ? (p.ends_at ?? null) : passageEndAt(passage, currentItem?.id);
}
function resetPassageEnd() {
  passageEndFired = false;
  passageNaturalEnd = false;
  $('passage-end').hidden = true;
}
// Two bound marks on the scrubber: the start (`t`) and, on the item the

// same flags, so a passage looks the same whether it is played or marked;
// each mark shows only on the item it was set in.
function renderPassageMarks() {
  scrub.querySelectorAll('.bound').forEach(b => b.remove());
  const dur = duration();
  if (!(dur > 0)) return;
  const id = currentItem?.id;
  const m = session?.marks;
  const b = (m?.in || m?.out)
          ? { t: m.in?.item_id === id ? m.in.seconds : null,
              end: m.out?.item_id === id ? m.out.seconds : null }
          : passage ? { t: passage.t, end: passageEndNow() } : null;
  if (!b) return;
  const marks = [['start', b.t, 'Passage starts at '], ['end', b.end, 'Passage ends at ']];
  for (const [cls, t, label] of marks) {
    if (t == null) continue;
    const b = document.createElement('div');
    b.className = 'bound ' + cls;

    b.title = label + fmtTime(t);
    scrub.appendChild(b);

}
// The time readout while inside a passage: elapsed / extent of the passage

function passageReadout(pos) {
  const endAt = passageEndNow();
  if (endAt == null) return `${fmtTime(pos)} · in passage`;
  const start = passage.t ?? 0;
  return `${fmtTime(pos - start)} / ${fmtTime(endAt - start)} in passage`;
}
// Called from timeupdate (local) and the 250ms tick (local and cast):
// position() already includes the HLS seek offset and, when casting, reads

function checkPassageEnd() {
  if (!passage || !currentItem || passageEndFired || !isPlaying()) return;
  const endAt = passageEndNow();
  if (!passageEnded(position(), endAt)) return;
  if (casting()) {
    // Sender-side stop: the default receiver knows nothing about passages,

    // second or so late at worst — the receiver is not changed in this bead).

$('passage-keep').onclick = keepWatching;
// "Back": close the player. The bare item route stays behind so Play from

$('passage-back').onclick = () => {

};

// Pressing play (ours or the <video> controls') while paused at the end

video.addEventListener('play', () => {

  if (passageEnded(position(), passageEndNow())) keepWatching();
});

// ---------------------------------------------------------------------------
// making a passage while watching: mark in, mark out, copy the link
// ---------------------------------------------------------------------------
// The logic is the server's: mark_in and mark_out post the position, and the
// session document comes back with the marks as the server kept them — the
// snap to a chapter start within two seconds, the swap when the out point is
// before the in point, and a mark on a later member of the work turned into
// the run's `until`. actions.link mints the passage's URL and the sentence

async function markAt(kind, body) {
  const act = session?.actions?.['mark_' + kind];

  try { session = await api(act.href, { method: 'POST',

}

}

$('btn-mark-out-clear').onclick = () => clearMarkAt('out');
$('btn-mark-link').onclick = copyPassageLink;

// ---------------------------------------------------------------------------
// trickplay scrub previews (mouse only; touch devices skip this)
// ---------------------------------------------------------------------------
let trickplay = null, trickplayItemId = null;

async function loadTrickplay(item) {

  try {
    const idx = await api(`/api/items/${item.id}/trickplay.json`);

  const rect = scrub.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  const t = frac * dur;
  const per = trickplay.cols * trickplay.rows;
  const frame = Math.min(Math.floor(t / trickplay.interval_seconds), trickplay.sheets * per - 1);
  const sheet = Math.floor(frame / per);
  const tile = frame % per;
  const col = tile % trickplay.cols, row = Math.floor(tile / trickplay.cols);
  const tw = trickplay.tile_width, th = trickplay.tile_height || 180;
  const img = $('thumb-img');
  img.style.width = tw + 'px';
  img.style.height = th + 'px';
  img.style.backgroundImage = `url(/api/items/${currentItem.id}/trickplay/${sheet}.jpg)`;
  img.style.backgroundPosition = `-${col * tw}px -${row * th}px`;
  $('thumb-time').textContent = fmtTime(t);
  const el = $('thumb');
  el.style.left = Math.min(Math.max(e.clientX - rect.left, tw / 2), Math.max(rect.width - tw / 2, tw / 2)) + 'px';
  el.hidden = false;
});
scrub.addEventListener('mouseleave', () => { $('thumb').hidden = true; });

// ---------------------------------------------------------------------------
// playback core (behavior preserved from the original single-list app)
// ---------------------------------------------------------------------------
function renderTrace(decision, videoEncoder) {
  const badge = `<span class="badge ${decision.method === 'direct_play' ? 'direct' : decision.method === 'transcode' ? 'transcode' : 'deny'}">${decision.method.replace('_', ' ')}</span>`;
  const enc = videoEncoder ? ` <span style="color:#8db4f0">via ${videoEncoder}</span>` : '';
  const dest = casting() ? ' <span style="color:#8db4f0">→ cast</span>' : '';
  $('status').innerHTML = badge + esc(decision.trace.at(-1)?.detail || '') + enc + dest;
  $('trace').innerHTML = '<h3>Decision trace</h3>' +
    decision.trace.map(s => `<div class="step ${s.passed ? 'pass' : 'fail'}">
      <span class="mark">${s.passed ? '✓' : '✗'}</span>
      <span class="check">${esc(s.check)}</span>
      <span class="detail">${esc(s.detail)}</span></div>`).join('');
}

function renderChapters() {
  const chs = currentItem?.media_info?.chapters || [];
  const pane = $('chapters');
  pane.innerHTML = '';
  scrub.querySelectorAll('.tick').forEach(t => t.remove());
  const dur = duration();
  for (const ch of chs) {
    const b = document.createElement('button');
    b.textContent = `${ch.title} · ${fmtTime(ch.start_seconds)}`;
    b.onclick = () => seekTo(ch.start_seconds);
    pane.appendChild(b);
    if (dur > 0) {
      const tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.left = (ch.start_seconds / dur * 100) + '%';
      scrub.appendChild(tick);
    }
  }
  renderPassageMarks();
}

async function stopSession() {
  if (sessionId) { fetch('/api/sessions/' + sessionId, { method: 'DELETE' }); sessionId = null; }
  session = null;
  if (hls) { hls.destroy(); hls = null; }
}

// startPlayback asks the server to decide-and-act, then routes the result
// to the local <video> or the cast device. Capabilities are the REAL
// playback device's: when casting, the Chromecast's manifest is sent no
// matter what the simulation dropdown says.
async function startPlayback(item, seekSeconds) {
  await stopSession();
  endFired = false; // fresh stream: re-arm natural-end detection
  const caps = casting() ? profiles.chromecastUltra
                         : profiles[$('profile').value];
  let resp;
  try {
    resp = await api(`/api/items/${item.id}/play`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        capabilities: caps, client_id: clientId || 'anonymous', seek_seconds: seekSeconds,
        // The passage this play is inside, if any: the server resolves it,
        // seeds the seek from `t`, publishes the bound to stop at, and
        // refuses progress writes until "keep watching".
        ...(passage ? { passage: { t: passage.t, end: passage.end, until: passage.until,
                                   from: passage.from, to: passage.to } } : {}),
        // playback selections: chosen audio stream, and an embedded bitmap
        // subtitle track to burn into the picture (forces a video re-encode)
        ...(selectedAudioOrdinal != null ? { audio_track: selectedAudioOrdinal } : {}),
        ...(burnSubOrdinal != null ? { subtitle_burn: burnSubOrdinal } : {}),
      }),
    });
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
    return;
  }
  session = resp; // the session document; every action below comes off it
  renderTrace(resp.decision, resp.video_encoder);
  method = resp.decision.method;
  if (method === 'deny') return;
  const isHls = method === 'transcode';
  // Every play has a session now, direct play included: its id is what the
  // stop action addresses, and the marks it carries are the chips'.
  sessionId = resp.id || null;
  seekOffset = isHls ? seekSeconds : 0;
  renderMarks();

  if (casting()) {
    try {
      await castLoad(resp.url, isHls, itemTitle(item), seekSeconds,
                     resp.decision.target?.segment_format, item);
    } catch (e) {
      $('status').textContent = 'Cast error: ' + (e.description || e.message || e);
    }
    return;
  }
  // play() rejects with AbortError if a newer load/stop interrupts it
  // (seek-restart, route change) — that interruption is intentional here.
  // It rejects with NotAllowedError when the page has had no gesture yet
  // — a passage link opened in a fresh tab (2026-09-07) — and that one is
  // said out loud: tryPlay shows the tap the browser wants.
  if (!isHls) {
    video.src = resp.url;
    if (seekSeconds) video.currentTime = seekSeconds;
    tryPlay();
  } else if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(resp.url);
    hls.attachMedia(video);
    tryPlay();
  } else {
    video.src = resp.url;
    tryPlay();
  }
  // subtitles must be re-attached after every (re)load, incl. seek-restarts
  attachLocalTracks(item);
}

// Autoplay that the browser refuses for want of a gesture is not an
// error, it is a question — answered by the one tap this button is.
function tryPlay() {
  $('tap-to-play').hidden = true;
  video.play().then(() => { $('tap-to-play').hidden = true; })
    .catch((e) => { if (e && e.name === 'NotAllowedError') $('tap-to-play').hidden = false; });
}
$('tap-to-play').onclick = () => { $('tap-to-play').hidden = true; video.play().catch(() => {}); };
video.addEventListener('play', () => { $('tap-to-play').hidden = true; });

function seekTo(t) {
  if (!currentItem || method === null) return;
  t = Math.max(0, Math.min(t, duration()));
  const rel = t - seekOffset;
  const canLocal = method === 'direct_play' || (rel >= 0 && rel <= (availableEnd() - seekOffset) - 0.5);
  if (canLocal) {
    if (casting()) {
      remotePlayer.currentTime = rel;
      remoteController.seek();
    } else {
      video.currentTime = rel;
    }
  } else {
    $('status').textContent =
      `Seeking to ${fmtTime(t)} — restarting transcode at that point…`;
    startPlayback(currentItem, t);
  }
}

// ---------------------------------------------------------------------------
// controls
// ---------------------------------------------------------------------------
function syncPlayButton() {
  $('btn-play').textContent = isPlaying() ? '⏸' : '⏵';
}
$('btn-play').onclick = () => {
  if (casting()) remoteController.playOrPause();
  else video.paused ? video.play().catch(() => {}) : video.pause();
};
$('btn-back').onclick = () => seekTo(position() - 10);
$('btn-fwd').onclick = () => seekTo(position() + 30);
$('btn-stop').onclick = () => {
  hideUpNext();
  if (casting()) { castEndSuppressed = true; remoteController.stop(); }
  else { video.pause(); video.removeAttribute('src'); video.load(); }
  stopSession();
  renderContinueWatching(); // playback session ended: refresh resume points
};
$('vol').oninput = (e) => {
  const v = parseFloat(e.target.value);
  if (casting()) { remotePlayer.volumeLevel = v; remoteController.setVolumeLevel(); }
  else video.volume = v;
};

scrub.addEventListener('click', e => {
  const rect = scrub.getBoundingClientRect();
  seekTo((e.clientX - rect.left) / rect.width * duration());
});

setInterval(() => {
  const dur = duration();
  if (dur > 0) {
    scrub.querySelector('.fill').style.width = Math.min(100, position() / dur * 100) + '%';
    scrub.querySelector('.avail').style.width = Math.min(100, availableEnd() / dur * 100) + '%';
    $('t-now').textContent = passage ? passageReadout(position()) : fmtTime(position());
  }
  syncPlayButton();
  checkPassageEnd(); // cast has no timeupdate on this side; the tick is its clock
  // Sought back below the bound after it fired: the panel goes, the bound re-arms.
  if (passageEndFired && !passageNaturalEnd && isPlaying()) {
    const endAt = passageEndNow();
    if (endAt != null && position() < endAt - 1) resetPassageEnd();
  }
  // Transcode tail: the final HLS fragment can end a hair short of the media
  // element's duration (audio/video buffers finish unevenly), so 'ended'
  // never fires — catch the stall at the very end of the stream, but only
  // within the ITEM's last seconds so catching up with a still-encoding
  // playlist mid-episode can never register as an end.
  if (currentItem && !casting() && method === 'transcode' && !endFired
      && !video.paused && !video.ended && isFinite(video.duration) && video.duration > 0
      && video.duration - video.currentTime < 0.5
      // 10s margin, not 3: container metadata routinely claims a few
      // seconds more than the stream actually carries (observed ~4s in
      // this library), and the player-level stuck-at-final-fragment
      // condition above is the real end signal.
      && dur > 0 && position() >= dur - 10) {
    onPlaybackEnded();
  }
  // Seeked back after a natural end: re-arm so a later end counts again.
  if (endFired && isPlaying() && dur > 0 && position() < dur - 10) endFired = false;
}, 250);

setInterval(() => {
  if (currentItem && isPlaying()) saveProgress(position()); // no-op inside a passage
}, 5000);

$('scan').onclick = async () => {
  await api('/api/scan', { method: 'POST' });
  const el = $('scan-status');
  const poll = setInterval(async () => {
    const s = await api('/api/scan');
    el.textContent = s.running
      ? (s.paused ? `scan paused (playback active) — ${s.probed}/${s.total} probed`
                  : `scanning… ${s.probed}/${s.total} probed, ${s.skipped} unchanged`)
      : `done: ${s.probed} probed, ${s.skipped} unchanged, ${s.removed} removed${s.errors ? ', ' + s.errors + ' errors' : ''}`;
    if (!s.running) { clearInterval(poll); loadItems(); }
  }, 1000);
};

// ---------------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------------
if ('serviceWorker' in navigator) {
  // The shell is cache-first (sw.js), so the first visit after a deploy runs
  // the OLD index.html while the new worker installs behind it — and a deep
  // link the old router does not know (a passage's `?ep=…`, 2026-09-07)
  // fell through to the root. When a new worker takes control of a page an
  // old one was serving, reload once, unless the player is mid-stream: a
  // film should not restart because a deploy landed. First-ever install
  // (no previous controller) does not reload.
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('/sw.js').catch(e => console.warn('SW registration failed', e));
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;
    if (currentItem && !$('player-pane').hidden) { swReloadPending = true; return; }
    location.reload();
  });
}
window.addEventListener('beforeunload', stopSession);
if (clientId) { $('profile-chip').textContent = '👤 ' + clientId; }
else openGate();
if (!location.hash) history.replaceState(null, '', '#/'); // canonical library route
itemsReady = loadItems().catch(e => console.warn('items load failed', e));
applyRoute(); // honor the current hash (deep links included) on first load
api('/api/system').then(sys => {
  baseUrl = sys.base_url || location.origin;
  const el = $('hw');
  const hw = sys.hardware;
  el.textContent = hw.chosen
    ? `HW: ${hw.chosen.kind} (${Object.values(hw.chosen.encoders).join(', ')})`
    : 'HW: software only';
  el.title = hw.trace.map(s => `${s.ok ? '✓' : '✗'} ${s.candidate}: ${s.detail}`).join('\n');
});
</script>
</body>
</html>
